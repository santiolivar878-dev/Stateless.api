<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section style="padding: 80px 60px; max-width:1200px; margin:0 auto; color: #fff; background: #000;">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:start;">

        <!-- CARRUSEL DE IMÁGENES -->
        <div style="position:relative; overflow:hidden;">
            <div id="producto-carousel" style="display:flex; transition:transform 0.4s ease;">
                <div style="min-width:100%; flex-shrink:0;">
                    <img th:src="${producto.imagen != null ? (producto.imagen.startsWith('http') ? producto.imagen : '/images/' + producto.imagen) : '/images/placeholder.jpg'}"
                         style="width:100%; height:600px; object-fit:cover; display:block;">
                </div>
            </div>
        </div>

        <!-- INFO PRODUCTO -->
        <div>
            <p th:if="${producto.categoria != null}" th:text="${producto.categoria.nombre}" 
               style="font-size:11px; letter-spacing:3px; text-transform:uppercase; opacity:0.4; margin-bottom:12px;"></p>
            
            <h1 th:text="${producto.nombre}" style="font-family:'Bebas Neue', sans-serif; font-size:56px; letter-spacing:4px; margin-bottom:16px;"></h1>
            
            <p th:if="${producto.precio != null}" 
               th:text="${'$' + #numbers.formatDecimal(producto.precio, 0, 'COMMA', 0, 'POINT')}" 
               style="font-family:'Bebas Neue', sans-serif; font-size:36px; letter-spacing:2px; margin-bottom:24px;"></p>
            
            <p th:text="${producto.descripcion}" style="font-size:14px; line-height:1.8; opacity:0.7; margin-bottom:32px;"></p>

            <!-- SELECTOR DE VARIANTES (COLORES) -->
            <div th:if="${not #lists.isEmpty(producto.variantes)}" style="margin-bottom:32px; padding-top:20px; border-top:1px solid #333;">
                <p style="font-size:11px; letter-spacing:3px; text-transform:uppercase; opacity:0.4; margin-bottom:12px;">
                    COLOR: <span id="color-nombre" style="color:#fff; font-weight:600;">Original</span>
                </p>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <!-- Círculo Original -->
                    <button type="button" onclick="seleccionarVariante('Original', null, null, null)"
                            style="width:36px; height:36px; border-radius:50%; border:3px solid #fff; cursor:pointer; background: #333;"></button>
                    
                    <!-- Círculos de Variantes -->
                    <button type="button" th:each="v : ${producto.variantes}"
                            th:onclick=" 'seleccionarVariante(\'' + ${v.color} + '\', \'' + ${v.imagen} + '\', ' + ${v.stockActual} + ', ' + ${v.id} + ')' "
                            th:style="'width:36px; height:36px; border-radius:50%; border:2px solid #555; cursor:pointer; background:' + ${v.hex}"></button>
                </div>
                <p id="variante-stock" style="font-size:12px; opacity:0.5; margin-top:10px;" 
                   th:text="'Stock: ' + ${producto.stockActual} + ' unidades'"></p>
            </div>

            <!-- FORMULARIO AÑADIR AL CARRITO -->
            <form th:action="@{'/carrito/agregar/' + ${producto.id}}" method="POST">
                <!-- ID de variante que se llena con JS -->
                <input type="hidden" name="varianteId" id="selected-variante-id">
                
                <button type="submit" id="btn-carrito"
                        style="width:100%; padding:16px; background:#fff; color:#000; border:none; font-weight:bold; letter-spacing:2px; cursor:pointer;">
                    AÑADIR AL CARRITO
                </button>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        function seleccionarVariante(nombre, imagenUrl, stock, id) {
            document.getElementById('color-nombre').innerText = nombre;
            document.getElementById('selected-variante-id').value = id;
            
            if(stock !== null) {
                document.getElementById('variante-stock').innerText = 'Stock: ' + stock + ' unidades';
                const btn = document.getElementById('btn-carrito');
                if(stock <= 0) {
                    btn.disabled = true;
                    btn.innerText = 'AGOTADO';
                    btn.style.opacity = '0.5';
                } else {
                    btn.disabled = false;
                    btn.innerText = 'AÑADIR AL CARRITO';
                    btn.style.opacity = '1';
                }
            }

            if(imagenUrl && imagenUrl !== 'null') {
                document.querySelector('#producto-carousel img').src = imagenUrl;
            }
        }
    </script>
</section>
</body>
</html>
