<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section style="padding: 60px 40px; max-width: 900px; margin: 0 auto; color: #fff; background: #000; min-height:85vh;">
    <h1 style="font-family:'Bebas Neue', sans-serif; font-size:40px; letter-spacing:3px; margin:0 0 6px;">MIS COMPRAS</h1>
    <p style="opacity:0.5; margin-bottom:40px; font-size:12px; letter-spacing:1px; text-transform:uppercase;">Historial de pedidos realizados</p>

    <div th:each="v : ${ventas}" style="border: 1px solid #222; padding: 25px; margin-bottom: 20px; background: #111;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
                <p style="font-size: 10px; opacity: 0.5; margin-bottom: 5px; letter-spacing:1px;">PEDIDO</p>
                <h4 th:text="'#' + ${v.id}" style="font-family:'Bebas Neue'; font-size:24px; letter-spacing: 2px; margin:0;"></h4>
            </div>
            <div>
                <p style="font-size: 10px; opacity: 0.5; margin-bottom: 5px; letter-spacing:1px;">FECHA</p>
                <p th:text="${v.createdAt != null ? #temporals.format(v.createdAt, 'dd/MM/yyyy') : 'Reciente'}" style="margin:0; font-size:13px;"></p>
            </div>
            <div>
                <p style="font-size: 10px; opacity: 0.5; margin-bottom: 5px; letter-spacing:1px;">ESTADO</p>
                <span th:if="${v.estado != null}" 
                      th:text="${#strings.toUpperCase(v.estado)}" 
                      th:style="'font-weight:bold; font-size:12px; color:' + (${v.estado == 'entregado'} ? '#00ff00' : '#ff9900')"></span>
                <span th:unless="${v.estado != null}" style="font-weight:bold; font-size:12px; color:#ff9900;">PROCESANDO</span>
            </div>
            <a th:href="@{'/account/tracking/' + ${v.id}}" class="btn-sl"
               style="background:#fff; color:#000; text-decoration:none; padding:8px 18px; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase;">
                RASTREAR
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(ventas)}" style="text-align: center; padding: 60px 20px; opacity: 0.4;">
        <p style="font-family:'Bebas Neue'; font-size:24px; letter-spacing:2px; margin-bottom:12px;">Aún no has realizado ninguna compra.</p>
        <a th:href="@{/}" style="color:#fff; font-size:11px; letter-spacing:2px; text-transform:uppercase; text-decoration:underline;">Explorar Colecciones →</a>
    </div>
</section>
</body>
</html>
