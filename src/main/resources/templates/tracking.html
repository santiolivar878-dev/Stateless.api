<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Pedido - STATELESS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        .nav-back { color: #fff; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-decoration: underline; }
        .card { background: #0d0d0d; border: 1px solid #222; padding: 28px; margin-bottom: 24px; border-radius: 8px; }
        .timeline { display: flex; justify-content: space-between; position: relative; max-width: 650px; margin: 20px auto 10px; }
        .timeline-step { text-align: center; width: 25%; }
        .step-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin: 0 auto 10px; }
        .dot-active { background: #fff; color: #000; box-shadow: 0 0 14px rgba(255,255,255,0.4); }
        .dot-inactive { background: #1a1a1a; color: #555; border: 1px solid #333; }
        .step-txt { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
        .txt-active { color: #fff; font-weight: 700; }
        .txt-inactive { color: #555; }
        .label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #777; font-weight: 700; margin-bottom: 6px; }
        .val { font-size: 14px; font-weight: 600; margin-bottom: 16px; color:#fff; }
        .btn-factura { background: #fff; color: #000; text-decoration: none; padding: 10px 20px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; display: inline-block; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; padding-bottom:15px; border-bottom:1px solid #111;">
        <a th:href="@{/}" style="font-family:'Bebas Neue'; font-size:28px; letter-spacing:4px; color:#fff; text-decoration:none;">STATELESS</a>
        <a th:href="@{/account/pedidos}" class="nav-back">← Volver a Mis Compras</a>
    </div>

    <div class="header">
        <div>
            <p style="font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#888; margin-bottom:4px;">Seguimiento en Vivo</p>
            <h1 style="font-family:'Bebas Neue'; font-size:42px; letter-spacing:5px; margin:0;" th:text="'PEDIDO #' + ${venta.id}">PEDIDO</h1>
        </div>
        <div>
            <span style="font-size:12px; font-weight:700; padding:6px 12px; background:#1a1a1a; border:1px solid #333; text-transform:uppercase; letter-spacing:1px; color:#00ff88;"
                  th:text="${venta.estado != null ? #strings.toUpperCase(venta.estado) : 'PAGO_CONFIRMADO'}">CONFIRMADO</span>
        </div>
    </div>

    <!-- PROGRESO DEL ENVÍO -->
    <div class="card">
        <p class="label" style="text-align:center; margin-bottom:28px;">Progreso de Envío</p>
        
        <div class="timeline">
            <!-- 1. Confirmado -->
            <div class="timeline-step">
                <div class="step-dot dot-active">✓</div>
                <div class="step-txt txt-active">Confirmado</div>
            </div>

            <!-- 2. Bodega -->
            <div class="timeline-step">
                <div class="step-dot" 
                     th:classappend="${(envio != null && envio.pasoActual >= 3) || venta.estado == 'en_preparacion' || venta.estado == 'enviado' || venta.estado == 'entregado'} ? 'dot-active' : 'dot-inactive'">2</div>
                <div class="step-txt" 
                     th:classappend="${(envio != null && envio.pasoActual >= 3) || venta.estado == 'en_preparacion' || venta.estado == 'enviado' || venta.estado == 'entregado'} ? 'txt-active' : 'txt-inactive'">En Bodega</div>
            </div>

            <!-- 3. En Camino -->
            <div class="timeline-step">
                <div class="step-dot" 
                     th:classappend="${(envio != null && envio.pasoActual >= 4) || venta.estado == 'enviado' || venta.estado == 'entregado'} ? 'dot-active' : 'dot-inactive'">3</div>
                <div class="step-txt" 
                     th:classappend="${(envio != null && envio.pasoActual >= 4) || venta.estado == 'enviado' || venta.estado == 'entregado'} ? 'txt-active' : 'txt-inactive'">En Camino</div>
            </div>

            <!-- 4. Entregado -->
            <div class="timeline-step">
                <div class="step-dot" 
                     th:classappend="${(envio != null && envio.pasoActual == 5) || venta.estado == 'entregado'} ? 'dot-active' : 'dot-inactive'">4</div>
                <div class="step-txt" 
                     th:classappend="${(envio != null && envio.pasoActual == 5) || venta.estado == 'entregado'} ? 'txt-active' : 'txt-inactive'">Entregado</div>
            </div>
        </div>
    </div>

    <!-- DETALLES DE GUÍA Y DESTINO -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="card">
            <p class="label">Transportadora</p>
            <p class="val" th:text="${envio != null && envio.transportadora != null ? envio.transportadora : 'Coordinadora / Servientrega'}"></p>
            
            <hr style="border-color:#222; margin:16px 0;">
            
            <p class="label">Número de Guía</p>
            <p class="val" style="font-family:monospace; letter-spacing:1px;" 
               th:text="${envio != null && envio.numeroGuia != null ? envio.numeroGuia : 'Generándose en bodega'}"></p>
        </div>

        <div class="card">
            <p class="label">Destino de Entrega</p>
            <p class="val" style="margin-bottom:4px;" th:text="${envio != null && envio.direccion != null ? envio.direccion : 'Dirección registrada'}"></p>
            <p style="font-size:12px; color:#888; margin-bottom:16px;" th:text="${envio != null && envio.ciudad != null ? envio.ciudad : 'Colombia'}"></p>
            
            <hr style="border-color:#222; margin:16px 0;">
            
            <p class="label">Método de Pago</p>
            <p class="val" style="text-transform:uppercase;" th:text="${venta.metodoPago != null ? venta.metodoPago : 'Tarjeta'}"></p>
        </div>
    </div>

    <!-- TOTAL E IVA -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
            <div>
                <p class="label">Total Liquidado (Inc. IVA 19%)</p>
                <p style="font-family:'Bebas Neue'; font-size:32px; color:#00ff88;" 
                   th:text="${venta.total != null ? '$' + #numbers.formatDecimal(venta.total, 0, 'COMMA', 0, 'POINT') + ' COP' : '$ 0 COP'}"></p>
            </div>
            <div>
                <a th:href="@{'/checkout/factura/' + ${venta.id}}" class="btn-factura">
                    Ver Factura Oficial →
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
