<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section style="background:#000; color:#fff; min-height:90vh; padding:60px 24px;">

<style>
    .profile-container {
        max-width: 900px;
        margin: 0 auto;
    }
    .profile-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        padding-bottom: 24px;
        margin-bottom: 36px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 16px;
    }
    .profile-nav {
        display: flex;
        gap: 24px;
        margin-bottom: 36px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 12px;
    }
    .profile-nav-link {
        color: rgba(255, 255, 255, 0.5);
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
        transition: color 0.2s ease;
        padding-bottom: 8px;
        border-bottom: 2px solid transparent;
    }
    .profile-nav-link.active,
    .profile-nav-link:hover {
        color: #fff;
        border-bottom-color: #fff;
    }
    .profile-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 32px;
        margin-bottom: 28px;
        backdrop-filter: blur(8px);
    }
    .profile-card-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 24px;
        letter-spacing: 2px;
        margin-bottom: 6px;
        color: #fff;
    }
    .profile-card-sub {
        font-size: 11px;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 24px;
        text-transform: uppercase;
    }
    .profile-label {
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }
    .profile-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 12px 16px;
        font-size: 13px;
        outline: none;
        transition: all 0.2s ease;
        margin-bottom: 20px;
    }
    .profile-input:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    }
    .btn-profile-save {
        background: #fff;
        color: #000;
        border: none;
        padding: 12px 28px;
        font-family: 'Bebas Neue', sans-serif;
        font-size: 16px;
        letter-spacing: 2px;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.2s ease;
    }
    .btn-profile-save:hover {
        background: #e5e5e5;
        transform: translateY(-1px);
    }
    .btn-profile-logout {
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px 18px;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
    }
    .btn-profile-logout:hover {
        color: #fff;
        border-color: #fff;
    }
    .alert-box {
        padding: 12px 18px;
        font-size: 12px;
        margin-bottom: 20px;
        letter-spacing: 1px;
    }
    .alert-success-box {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #4ade80;
    }
    .alert-danger-box {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #f87171;
    }
</style>

<div class="profile-container">

    <!-- HEADER -->
    <div class="profile-header">
        <div>
            <p style="font-size:11px; letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:6px;">Mi Cuenta</p>
            <h1 style="font-family:'Bebas Neue', sans-serif; font-size:clamp(36px, 6vw, 56px); letter-spacing:6px; line-height:1; margin:0;">
                PANEL DE PERFIL
            </h1>
        </div>
        <div>
            <form th:action="@{/logout}" method="POST" style="margin:0;">
                <button type="submit" class="btn-profile-logout">Cerrar Sesión</button>
            </form>
        </div>
    </div>

    <!-- NAVEGACIÓN DE CUENTA -->
    <div class="profile-nav">
        <a th:href="@{/account/profile}" class="profile-nav-link active">Información Personal</a>
        <a th:href="@{/account/orders}" class="profile-nav-link">Mis Pedidos</a>
        <a th:href="@{/admin/dashboard}" sec:authorize="hasAnyRole('ADMIN', 'EMPLEADO')" class="profile-nav-link" style="color:var(--drift-blue, #CA0080);">
            ⚡ Panel Admin
        </a>
    </div>

    <!-- MENSAJES DE FEEDBACK -->
    <div th:if="${success}" class="alert-box alert-success-box" th:text="${success}"></div>
    <div th:if="${error}" class="alert-box alert-danger-box" th:text="${error}"></div>

    <!-- 1. INFORMACIÓN PERSONAL -->
    <div class="profile-card">
        <h2 class="profile-card-title">DATOS PERSONALES</h2>
        <p class="profile-card-sub">Actualiza tu nombre y correo de contacto</p>

        <form th:action="@{/account/profile/update}" method="POST">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div>
                    <label class="profile-label" for="name">Nombre Completo</label>
                    <input type="text" id="name" name="name" class="profile-input" 
                           th:value="${user != null ? user.name : #authentication.name}" required>
                </div>
                <div>
                    <label class="profile-label" for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="profile-input" 
                           th:value="${user != null ? user.email : ''}" required>
                </div>
            </div>

            <button type="submit" class="btn-profile-save">GUARDAR CAMBIOS</button>
        </form>
    </div>

    <!-- 2. SEGURIDAD / CAMBIO DE CONTRASEÑA -->
    <div class="profile-card">
        <h2 class="profile-card-title">SEGURIDAD Y CONTRASEÑA</h2>
        <p class="profile-card-sub">Crea una contraseña segura de mínimo 8 caracteres</p>

        <form th:action="@{/account/password/update}" method="POST">
            <div>
                <label class="profile-label" for="current_password">Contraseña Actual</label>
                <input type="password" id="current_password" name="current_password" class="profile-input" placeholder="••••••••" required>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div>
                    <label class="profile-label" for="new_password">Nueva Contraseña</label>
                    <input type="password" id="new_password" name="new_password" class="profile-input" placeholder="••••••••" required>
                </div>
                <div>
                    <label class="profile-label" for="new_password_confirmation">Confirmar Nueva Contraseña</label>
                    <input type="password" id="new_password_confirmation" name="new_password_confirmation" class="profile-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-profile-save">ACTUALIZAR CONTRASEÑA</button>
        </form>
    </div>

</div>

</section>
</body>
</html>
