<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section style="background:#f5f5f5; color:#000; min-height:90vh; padding:60px 20px;">

    <div style="max-width:800px; margin:0 auto; background:#fff; border:1px solid #eee; padding:48px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">

        <!-- HEADER FACTURA -->
        <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #000; padding-bottom:24px; margin-bottom:32px;">
            <div>
                <h1 style="font-family:'Bebas Neue'; font-size:40px; letter-spacing:4px; margin:0 0 4px;">STATELESS</h1>
                <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin:0;">Comprobante Oficial de Compra</p>
            </div>
            <div style="text-align:right;">
                <p style="font-family:'Bebas Neue'; font-size:24px; letter-spacing:2px; margin:0;" th:text="'ORDEN #' + ${venta.id}"></p>
                <p style="font-size:12px; opacity:0.5; margin:0;" th:text="${#temporals.format(venta.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
                <span style="display:inline-block; background:green; color:#fff; font-size:10px; font-weight:700; padding:3px 8px; margin-top:6px; letter-spacing:1px;">PAGO CONFIRMADO</span>
            </div>
        </div>

        <!-- DATOS DEL CLIENTE Y ENVÍO -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-bottom:36px;">
            <div>
                <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:6px; font-weight:700;">Comprador</p>
                <p style="font-size:14px; font-weight:700; margin:0;" th:text="${venta.usuario != null ? venta.usuario.name : 'Cliente'}"></p>
                <p style="font-size:12px; opacity:0.7; margin:0;" th:text="${venta.usuario != null ? venta.usuario.email : ''}"></p>
            </div>
            <div>
                <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:6px; font-weight:700;">Dirección de Entrega</p>
                <p style="font-size:13px; margin:0;" th:text="${venta.envio != null ? venta.envio.direccion : 'Por definir'}"></p>
                <p style="font-size:13px; font-weight:700; margin:0;" th:text="${venta.envio != null ? venta.envio.ciudad : ''}"></p>
            </div>
        </div>

        <!-- TABLA DE PRODUCTOS -->
        <table style="width:100%; border-collapse:collapse; margin-bottom:32px;">
            <thead>
                <tr style="border-bottom:2px solid #000;">
                    <th style="text-align:left; padding:10px 0; font-size:11px; letter-spacing:2px; text-transform:uppercase;">Prenda</th>
                    <th style="text-align:center; padding:10px 0; font-size:11px; letter-spacing:2px; text-transform:uppercase;">Cant.</th>
                    <th style="text-align:right; padding:10px 0; font-size:11px; letter-spacing:2px; text-transform:uppercase;">Precio</th>
                    <th style="text-align:right; padding:10px 0; font-size:11px; letter-spacing:2px; text-transform:uppercase;">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${venta.items}" style="border-bottom:1px solid #f0f0f0;">
                    <td style="padding:14px 0;">
                        <p style="font-size:13px; font-weight:700; margin:0;" th:text="${item.producto != null ? item.producto.nombre : 'Producto'}"></p>
                        <span th:if="${item.variante != null}" th:text="'Color: ' + ${item.variante.color}" style="font-size:11px; opacity:0.5;"></span>
                    </td>
                    <td style="text-align:center; font-size:13px;" th:text="${item.cantidad}"></td>
                    <td style="text-align:right; font-size:13px;" th:text="${'$' + #numbers.formatDecimal(item.precioUnitario, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td style="text-align:right; font-size:13px; font-weight:700;" th:text="${'$' + #numbers.formatDecimal(item.precioUnitario * item.cantidad, 0, 'COMMA', 0, 'POINT')}"></td>
                </tr>
            </tbody>
        </table>

        <!-- TOTALES -->
        <div style="display:flex; justify-content:flex-end; margin-bottom:40px;">
            <div style="width:260px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px;">
                    <span style="opacity:0.6;">Envío</span>
                    <span style="color:green; font-weight:600;">GRATIS</span>
                </div>
                <div style="display:flex; justify-content:space-between; padding-top:12px; border-top:2px solid #000;">
                    <span style="font-weight:700; font-size:14px;">TOTAL</span>
                    <span th:text="${'$' + #numbers.formatDecimal(venta.total, 0, 'COMMA', 0, 'POINT') + ' COP'}" style="font-family:'Bebas Neue'; font-size:28px;"></span>
                </div>
            </div>
        </div>

        <!-- ACCIONES -->
        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #eee; padding-top:24px;">
            <a th:href="@{/}" style="color:#000; font-size:11px; letter-spacing:2px; text-transform:uppercase; text-decoration:none; font-weight:700;">
                ← Volver a la Tienda
            </a>
            
            <div style="display:flex; gap:12px;">
                <!-- Botón Descargar PDF usando el servicio de tu backend -->
                <a th:href="@{'/checkout/factura/' + ${venta.id} + '/descargar'}" 
                   style="background:#fff; color:#000; border:1px solid #000; padding:10px 20px; font-size:11px; letter-spacing:2px; text-transform:uppercase; text-decoration:none; font-weight:700; display:inline-block;">
                    Descargar PDF
                </a>
                
                <button onclick="window.print()" style="background:#000; color:#fff; border:none; padding:10px 24px; font-size:11px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; font-weight:700;">
                    Imprimir
                </button>
            </div>
        </div>

    </div>

</section>
</body>
</html>
