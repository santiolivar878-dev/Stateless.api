<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Factura</title>
    <style>
        body { font-family: sans-serif; color: #000; padding: 20px; }
        .header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        .brand { font-size: 28px; font-weight: bold; }
        .info-table { width: 100%; margin-bottom: 30px; }
        .items-table { width: 100%; border-collapse: collapse; }
        .items-table th { border-bottom: 1px solid #000; text-align: left; padding: 8px; font-size: 12px; }
        .items-table td { padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; }
        .total-box { text-align: right; margin-top: 20px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">STATELESS</div>
        <p>FACTURA DE VENTA #<span th:text="${venta.id}"></span></p>
        <p th:text="${#temporals.format(venta.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
    </div>

    <table class="info-table">
        <tr>
            <td>
                <strong>CLIENTE:</strong><br/>
                <span th:text="${venta.usuario.name}"></span><br/>
                <span th:text="${venta.usuario.email}"></span>
            </td>
            <td>
                <strong>ENVÍO:</strong><br/>
                <span th:text="${venta.envio.direccion}"></span><br/>
                <span th:text="${venta.envio.ciudad}"></span>
            </td>
        </tr>
    </table>

    <table class="items-table">
        <thead>
            <tr>
                <th>PRODUCTO</th>
                <th>CANT</th>
                <th>PRECIO</th>
                <th>SUBTOTAL</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${venta.items}">
                <td th:text="${item.producto.nombre}"></td>
                <td th:text="${item.cantidad}"></td>
                <td th:text="${'$' + item.precioUnitario}"></td>
                <td th:text="${'$' + (item.precioUnitario * item.cantidad)}"></td>
            </tr>
        </tbody>
    </table>

    <div class="total-box">
        TOTAL PAGADO: $<span th:text="${venta.total}"></span>
    </div>

    <div style="margin-top: 50px; font-size: 10px; text-align: center; color: #999;">
        Documento generado automáticamente por el sistema STATELESS.
    </div>
</body>
</html>
