<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section style="padding: 60px; max-width: 1100px; margin: 0 auto; background: #fff; color: #000;">
    <style>
        .method-card { border: 1px solid #ddd; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; background: #fdffdf; color: #000; }
        .method-card.active { border: 2px solid #000; background: #f0f0f0; }
        .method-card p { margin: 0; pointer-events: none; }
        .form-control { border-radius: 0; border: 1px solid #ccc; padding: 12px; }
        .resumen-box { border-left: 1px solid #eee; padding-left: 40px; }
    </style>

    <h1 style="font-family:'Bebas Neue'; font-size:48px; letter-spacing:4px; margin-bottom:40px;">CHECKOUT</h1>

    <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:60px;">
        <!-- FORMULARIO -->
        <div>
            <h2 style="font-family:'Bebas Neue'; font-size:24px; margin-bottom:24px;">DATOS DE ENVÍO</h2>
            <form id="checkout-form">
                <input type="text" id="direccion" placeholder="DIRECCIÓN DE ENTREGA" class="form-control mb-3" required>
                <input type="text" id="ciudad" placeholder="CIUDAD" class="form-control mb-4" required>

                <h2 style="font-family:'Bebas Neue'; font-size:24px; margin-bottom:24px;">MÉTODO DE PAGO</h2>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:30px;">
                    <div onclick="seleccionarMetodo('tarjeta')" id="opt-tarjeta" class="method-card active">
                        <p>💳 TARJETA</p>
                    </div>
                    <div onclick="seleccionarMetodo('nequi')" id="opt-nequi" class="method-card">
                        <p>📱 NEQUI</p>
                    </div>
                    <div onclick="seleccionarMetodo('pse')" id="opt-pse" class="method-card">
                        <p>🏦 PSE</p>
                    </div>
                    <div onclick="seleccionarMetodo('efecty')" id="opt-efecty" class="method-card">
                        <p>💵 EFECTY</p>
                    </div>
                </div>

                <div id="panel-pago" class="p-3 bg-light mb-4 border">
                    <p id="msg-pago" style="font-size: 12px; margin: 0;">Pago seguro con Tarjeta de Crédito/Débito.</p>
                </div>

                <button type="submit" id="btn-pagar" class="btn btn-dark w-100 p-3" style="font-weight:bold; border-radius:0; letter-spacing:2px;">
                    CONFIRMAR PEDIDO
                </button>
            </form>
        </div>

        <!-- RESUMEN -->
        <div class="resumen-box">
            <h2 style="font-family:'Bebas Neue'; font-size:24px; margin-bottom:24px;">RESUMEN</h2>
            <div th:each="item : ${carrito.items}" style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <div>
                    <p th:text="${item.producto.nombre}" style="font-weight:bold; margin:0;"></p>
                    <p th:text="'CANT: ' + ${item.cantidad}" style="font-size:11px; opacity:0.5;"></p>
                </div>
                <p th:text="${'$' + #numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}" style="font-weight:bold;"></p>
            </div>
            <hr>
            <div style="display:flex; justify-content:space-between;">
                <p style="font-family:'Bebas Neue'; font-size:24px;">TOTAL</p>
                <p th:text="${'$' + #numbers.formatDecimal(carrito.total, 0, 'COMMA', 0, 'POINT')}" style="font-family:'Bebas Neue'; font-size:24px;"></p>
            </div>
        </div>
    </div>

    <script>
        let metodoSeleccionado = 'tarjeta';

        function seleccionarMetodo(m) {
            metodoSeleccionado = m;
            // Quitar clase activa de todos
            document.querySelectorAll('.method-card').forEach(el => el.classList.remove('active'));
            // Poner activa al seleccionado
            document.getElementById('opt-' + m).classList.add('active');
            
            // Cambiar mensaje informativo
            const msg = document.getElementById('msg-pago');
            if(m === 'nequi') msg.innerText = "Ingresa tu número de celular Nequi en el siguiente paso.";
            else if(m === 'pse') msg.innerText = "Serás redirigido a la pasarela de tu banco.";
            else if(m === 'efecty') msg.innerText = "Se generará un pin para pagar en puntos Efecty.";
            else msg.innerText = "Pago seguro con Tarjeta de Crédito/Débito.";
        }

        document.getElementById('checkout-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-pagar');
            btn.disabled = true;
            btn.innerText = "VALIDANDO...";

            try {
                const response = await fetch('/checkout/procesar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        direccion: document.getElementById('direccion').value,
                        ciudad: document.getElementById('ciudad').value,
                        metodo_pago: metodoSeleccionado
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    window.location.href = data.redirect;
                } else {
                    const errorData = await response.json();
                    alert("Error en el pedido: " + (errorData.error || "Falla en el servidor"));
                    btn.disabled = false;
                    btn.innerText = "CONFIRMAR PEDIDO";
                }
            } catch (err) {
                alert("Error de red. Verifica que Docker esté corriendo en el puerto 8081.");
                btn.disabled = false;
                btn.innerText = "CONFIRMAR PEDIDO";
            }
        });
    </script>
</section>
</body>
</html>
