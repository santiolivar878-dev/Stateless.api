<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STATELESS — Autenticación</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }
        #wavesCanvas {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .auth-brand {
            position: fixed;
            top: 24px; 
            left: 32px;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            letter-spacing: 3px;
            z-index: 10;
        }
        .auth-card {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }
        .auth-card label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }
        .auth-card .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            border-radius: 0;
            outline: none;
            transition: all 0.2s ease;
        }
        .auth-card .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.6);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }
        .auth-card .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .auth-card .btn-stateless {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 13px;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 0;
            transition: all 0.2s ease;
            font-weight: 700;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .auth-card .btn-stateless:hover {
            background: #e5e5e5;
            color: #000;
            transform: translateY(-1px);
        }
        .auth-card a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: color 0.2s;
        }
        .auth-card a:hover {
            color: #fff;
            text-decoration: underline;
        }
        .auth-card h2 {
            font-family: 'Bebas Neue', sans-serif;
            color: #fff;
            font-size: 32px;
            letter-spacing: 3px;
            margin: 0 0 4px;
        }
        .auth-card .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            letter-spacing: 1px;
            margin: 0 0 24px;
        }
        .auth-card .alert {
            font-size: 12px;
            border-radius: 0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Canvas de ondas interactivo de fondo -->
    <canvas id="wavesCanvas"></canvas>

    <div class="auth-brand">
        <a th:href="@{/}" style="color:#fff; text-decoration:none;">STATELESS</a>
    </div>

    <div class="min-vh-100 d-flex justify-content-center align-items-center py-5" style="position:relative; z-index:2;">
        <div class="auth-card">
            <div th:replace="${content}"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wavesCanvas');
        const ctx = canvas.getContext('2d');
        let w, h, dots = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            dots = [];
            const spacing = 26;
            for (let x = 0; x < w + spacing; x += spacing) {
                for (let y = 0; y < h + spacing; y += spacing) {
                    dots.push({ baseX: x, baseY: y });
                }
            }
        }
        resize();
        window.addEventListener('resize', resize);

        let t = 0;
        function animate() {
            t += 0.012;
            ctx.clearRect(0, 0, w, h);
            for (const d of dots) {
                const dx = (d.baseX - w / 2) / w;
                const dy = (d.baseY - h / 2) / h;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const wave = Math.sin(dist * 10 - t * 2) * 0.5 + 0.5;
                const size = 1 + wave * 2.2;
                const alpha = 0.12 + wave * 0.45;
                ctx.beginPath();
                ctx.arc(d.baseX, d.baseY, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
