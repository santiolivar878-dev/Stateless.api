<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <title>STATELESS | Auth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .min-vh-100 { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 100%; max-width: 400px; padding: 40px; background: rgba(255,255,255,0.05); border: 1px solid #222; }
        .subtitle { color: #666; font-size: 12px; margin-bottom: 25px; }

<body>
    <div class="min-vh-100">
        <div th:replace="${content}"></div>

</html>
