<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <title>STATELESS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#000; margin:0; font-family:sans-serif; color:#fff; }
        .auth-card { background:rgba(0,0,0,0.8); padding:40px; border:1px solid #333; width:400px; }
        .form-control { background:#111; border:1px solid #333; color:#fff; margin-bottom:15px; border-radius:0; }
        .btn-stateless { width:100%; background:#fff; color:#000; border:none; padding:10px; font-weight:bold; }
        .auth-brand { position:fixed; top:20px; left:20px; font-size:20px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="auth-brand">STATELESS</div>
    <div class="min-vh-100 d-flex justify-content-center align-items-center">
        <div th:replace="${content}"></div>
    </div>
</body>
</html>
