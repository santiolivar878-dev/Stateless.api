<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STATELESS — Streetwear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        .navbar-stateless { background: #000; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 1000; }
        .brand { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #fff; text-decoration: none; letter-spacing: 5px; font-weight: bold; }
        .nav-links { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; transition: 0.2s; font-weight: 500; }
        .nav-links a:hover { opacity: 1; }
        .cart-badge { background: #fff; color: #000; border-radius: 50%; padding: 2px 7px; font-size: 10px; font-weight: bold; margin-left: 5px; }
        .footer-stateless { background-color: #000; color: #fff; padding: 60px 40px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <nav class="navbar-stateless">
        <a th:href="@{/}" class="brand">STATELESS</a>
        
        <ul class="nav-links">
            <li><a th:href="@{/}">INICIO</a></li>
            <li><a th:href="@{/essentials}">ESSENTIALS</a></li>
            <li><a th:href="@{/waves}">WAVES</a></li>
            <li><a th:href="@{/octane}">OCTANE</a></li>
        </ul>

        <div style="display:flex; gap:20px; align-items:center;">
            <a th:href="@{/carrito}" style="color:#fff; text-decoration:none; font-size:12px; letter-spacing:1px;">
                CARRITO <span class="cart-badge" th:text="${session.cartCount != null ? session.cartCount : '0'}">0</span>
            </a>

            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" style="color:#fff; text-decoration:none; font-size:12px; letter-spacing:1px;">INGRESAR</a>
            </div>
            <div sec:authorize="isAuthenticated()">
                <a th:href="@{/account}" style="color:#fff; text-decoration:none; font-size:12px; letter-spacing:1px;">MI CUENTA</a>
            </div>
        </div>
    </nav>

    <div th:replace="${content}"></div>

    <footer class="footer-stateless">
        <div style="font-family:'Bebas Neue'; font-size:32px; letter-spacing:6px; margin-bottom:10px;">STATELESS</div>
        <p style="font-size:11px; opacity:0.4; letter-spacing:2px; text-transform:uppercase;">Define tu mundo. Sin etiquetas.</p>
        <p style="font-size:11px; opacity:0.3; margin-top:20px;">© 2026 STATELESS. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
