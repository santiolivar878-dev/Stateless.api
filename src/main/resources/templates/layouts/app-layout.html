<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <title>STATELESS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        .navbar-stateless { background: #000; padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand { font-family: 'Bebas Neue'; font-size: 32px; color: #fff; text-decoration: none; letter-spacing: 5px; }
        .nav-links { display: flex; gap: 30px; list-style: none; margin: 0; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }
        .cart-badge { background: #fff; color: #000; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>
    <nav class="navbar-stateless">
        <a th:href="@{/}" class="brand">STATELESS</a>
        
        <ul class="nav-links">
            <li><a th:href="@{/}">INICIO</a></li>
            <li><a th:href="@{/essentials}">ESSENTIALS</a></li>
            <li><a th:href="@{/waves}">WAVES</a></li>
            <li><a th:href="@{/octane}">OCTANE</a></li>
        </ul>

        <div style="display:flex; gap:20px; align-items:center;">
            <!-- Carrito con protección de nulos -->
            <a th:href="@{/carrito}" style="color:#fff; text-decoration:none; font-size:12px;">
                CARRITO <span class="cart-badge" th:text="${session.cartCount != null ? session.cartCount : '0'}">0</span>
            </a>

            <!-- Lógica de usuario -->
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" style="color:#fff; text-decoration:none; font-size:12px;">INGRESAR</a>
            </div>
            <div sec:authorize="isAuthenticated()">
                <a th:href="@{/account/profile}" style="color:#fff; text-decoration:none; font-size:12px;">MI CUENTA</a>
            </div>
        </div>
    </nav>

    <div th:replace="${content}"></div>
</body>
</html>
