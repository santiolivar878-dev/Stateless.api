<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STATELESS | Panel de Control</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
            color: #000;
            margin: 0;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 26px;
            letter-spacing: 4px;
            padding: 28px 24px 20px;
            border-bottom: 1px solid #222;
        }

        .sidebar-subtitle {
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.4;
            text-transform: uppercase;
            margin-top: 4px;
            font-family: 'Inter', sans-serif;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .sidebar-nav a {
            display: block;
            padding: 12px 24px;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-weight: 500;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            opacity: 1;
            border-left-color: #fff;
            background-color: #111;
        }

        .sidebar-footer {
            padding: 20px 24px;
            border-top: 1px solid #222;
            font-size: 11px;
            opacity: 0.5;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOPBAR */
        .topbar {
            background-color: #fff;
            padding: 18px 32px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            letter-spacing: 3px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .topbar-actions a {
            color: #000;
            text-decoration: none;
            opacity: 0.7;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .topbar-actions a:hover { opacity: 1; }

        .page-body {
            padding: 32px;
            flex: 1;
        }

        /* CARDS & STATS */
        .stat-card {
            background: #fff;
            border: 1px solid #eee;
            padding: 24px;
            margin-bottom: 24px;
        }

        .stat-card .stat-label {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-card .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            letter-spacing: 2px;
        }

        /* TABLAS STATELESS */
        .stateless-table {
            width: 100%;
            background: #fff;
            border: 1px solid #eee;
            border-collapse: collapse;
        }

        .stateless-table thead th {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 16px 20px;
            border-bottom: 2px solid #000;
            font-weight: 700;
            background: #fafafa;
        }

        .stateless-table tbody td {
            padding: 14px 20px;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .stateless-table tbody tr:hover { background-color: #fafafa; }

        /* BOTONES */
        .btn-sl {
            background-color: #000;
            color: #fff;
            border: 1px solid #000;
            padding: 8px 20px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .btn-sl:hover { background-color: #333; color: #fff; }

        .btn-sl-outline {
            background-color: #fff;
            color: #000;
            border: 1px solid #000;
            padding: 8px 20px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .btn-sl-outline:hover { background-color: #000; color: #fff; }

        .btn-sl-danger {
            background-color: #fff;
            color: #c00;
            border: 1px solid #c00;
            padding: 8px 20px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .btn-sl-danger:hover { background-color: #c00; color: #fff; }

        /* FORMULARIOS */
        .sl-form-group { margin-bottom: 20px; }

        .sl-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .sl-input {
            width: 100%;
            border: 1px solid #ddd;
            padding: 10px 14px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        .sl-input:focus { border-color: #000; }

        .alert-success-sl {
            background-color: #000;
            color: #fff;
            padding: 12px 20px;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-brand">
            STATELESS
            <div class="sidebar-subtitle">
                <span sec:authorize="hasRole('ADMIN')">Panel Administrador</span>
                <span sec:authorize="hasRole('EMPLEADO')">Panel Empleado</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}">Inicio</a>
            <a th:href="@{/admin/ventas}">Ventas</a>
            <a th:href="@{/admin/usuarios}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
            <a th:href="@{/admin/envios}">Envíos</a>
            <a th:href="@{/admin/productos}">Productos</a>
            <a th:href="@{/admin/proveedores}">Proveedores</a>
            <a th:href="@{/admin/categorias}">Categorías</a>
            <a th:href="@{/admin/reportes}">Reportes</a>
        </nav>

        <div class="sidebar-footer">
            <span sec:authentication="name">Usuario</span>
            <form th:action="@{/logout}" method="POST" style="margin:0;">
                <button type="submit" style="background:none; border:none; color:#999; font-size:11px; cursor:pointer; text-transform:uppercase;">Salir</button>
            </form>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">PANEL DE CONTROL</div>
            <div class="topbar-actions">
                <a th:href="@{/}">← Ver Tienda</a>
            </div>
        </div>

        <div class="page-body">
            <div th:replace="${content}"></div>
        </div>
    </div>
<script>
    window.addEventListener('pageshow', function (event) {
        // Si la página viene del botón "Atrás" o caché del navegador
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
            // Fuerza una petición real al servidor (si no hay sesión, Spring Boot lo manda al Login)
            window.location.reload();
        }
    });
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
