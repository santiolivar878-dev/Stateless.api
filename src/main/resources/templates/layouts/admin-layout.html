<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="utf-8">
    <title>STATELESS | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f4f4; margin: 0; display: flex; }
        .sidebar { width: 240px; background: #000; color: #fff; min-height: 100vh; padding: 20px; position: fixed; }
        .main-content { margin-left: 240px; flex: 1; padding: 40px; }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 10px 0; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; }
        .sidebar a:hover { opacity: 1; }
        .stat-card { background: #fff; padding: 20px; border: 1px solid #eee; }
        .stat-label { font-size: 10px; text-transform: uppercase; opacity: 0.5; }
        .stat-value { font-family: 'Bebas Neue'; font-size: 30px; }
        .btn-sl { background: #000; color: #fff; border: none; padding: 10px 20px; font-size: 11px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="font-family:'Bebas Neue'; letter-spacing: 4px;">STATELESS</h2>
        <hr style="border-color: #333;">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/productos}">Productos</a>
        <a th:href="@{/admin/ventas}">Ventas</a>
        <a th:href="@{/admin/usuarios}">Usuarios</a>
        <a th:href="@{/admin/reportes/ventas}">Reportes</a>
        <hr style="border-color: #333;">
        <form th:action="@{/logout}" method="POST">
            <button type="submit" style="background:none; border:none; color:red; cursor:pointer; font-size:10px; letter-spacing:2px;">CERRAR SESIÓN</button>
        </form>
    </div>
    <div class="main-content">
        <div th:replace="${content}"></div>
    </div>
</body>
</html>
