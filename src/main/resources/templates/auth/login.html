<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/guest-layout :: layout(content=~{::section})}">
<body>
    <section class="auth-card">
        <h2>INICIAR SESIÓN</h2>
        <p class="subtitle">Accede a tu cuenta Stateless</p>

        <!-- Mensajes de error -->
        <div th:if="${param.error}" class="alert alert-danger" style="font-size:12px;">
            Credenciales incorrectas o cuenta inactiva.
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}" style="font-size:12px;"></div>

        <form th:action="@{/login}" method="POST">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" class="form-control" type="email" placeholder="tucorreo@ejemplo.com" required autofocus>

            <label for="password">Contraseña</label>
            <input id="password" name="password" class="form-control" type="password" placeholder="••••••••" required>

            <button type="submit" class="btn-stateless">INGRESAR</button>

            <p class="text-center mt-4" style="font-size:11px; color:rgba(255,255,255,0.5);">
                ¿No tienes cuenta? <a th:href="@{/register}" style="color:#fff;">Regístrate aquí</a>
            </p>
        </form>

        <!-- Separador -->
        <div style="display:flex; align-items:center; gap:16px; margin-top:32px; margin-bottom:24px;">
            <div style="flex:1; height:1px; background:rgba(255,255,255,0.1);"></div>
            <span style="font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.3); text-transform:uppercase;">O</span>
            <div style="flex:1; height:1px; background:rgba(255,255,255,0.1);"></div>
        </div>

        <!-- Botón Google -->
        <a th:href="@{/oauth2/authorization/google}" 
           style="display:flex; align-items:center; justify-content:center; gap:12px; width:100%; border:1px solid rgba(255,255,255,0.2); padding:14px; color:#fff; text-decoration:none; font-size:12px; letter-spacing:2px; text-transform:uppercase; transition:background 0.2s;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_\"Logo\".svg\" width="18">
            Continuar con Google
        </a>
    </section>
</body>
</html>
