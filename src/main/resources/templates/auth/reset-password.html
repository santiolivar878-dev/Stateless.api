<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/guest-layout :: layout(content=~{::section})}">
<body>
    <section class="auth-card">
        <h2 style="font-family:'Bebas Neue'; letter-spacing: 2px;">NUEVA CONTRASEÑA</h2>
        <p class="subtitle">Crea una contraseña segura para tu cuenta.</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="font-size:12px; background: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 20px;"></div>

        <form th:action="@{/reset-password}" method="POST">
            <!-- El token que viene de la URL -->
            <input type="hidden" name="token" th:value="${token}">
            
            <label style="color: #aaa; font-size: 11px; text-transform: uppercase;">Nueva contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required style="background: #111; border: 1px solid #333; color: #fff; width: 100%; padding: 10px; margin-bottom: 20px;">

            <label style="color: #aaa; font-size: 11px; text-transform: uppercase;">Confirmar contraseña</label>
            <input type="password" name="password_confirmation" class="form-control" placeholder="••••••••" required style="background: #111; border: 1px solid #333; color: #fff; width: 100%; padding: 10px; margin-bottom: 20px;">
            
            <button type="submit" class="btn-stateless" style="background: #fff; color: #000; width: 100%; padding: 12px; font-weight: bold; border: none; cursor: pointer;">RESTABLECER CONTRASEÑA</button>
        </form>
    </section>
</body>
</html>
