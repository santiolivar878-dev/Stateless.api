<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/guest-layout :: layout(content=~{::section})}">
<body>
    <section>
        <h2>NUEVA CONTRASEÑA</h2>
        <p class="subtitle">Crea una contraseña segura para tu cuenta</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="background:#2b0000; border:1px solid #c00; color:#ff8a8a;"></div>

        <form th:action="@{/reset-password}" method="POST">
            <!-- Token oculto recibido por URL -->
            <input type="hidden" name="token" th:value="${token}">

            <label for="password">Nueva Contraseña</label>
            <input id="password" name="password" class="form-control" type="password" placeholder="••••••••" required autofocus>

            <label for="password_confirmation">Confirmar Contraseña</label>
            <input id="password_confirmation" name="password_confirmation" class="form-control" type="password" placeholder="••••••••" required>

            <button type="submit" class="btn-stateless">RESTABLECER CONTRASEÑA</button>

            <p class="text-center mt-4" style="font-size:11px; color:rgba(255,255,255,0.5);">
                <a th:href="@{/login}">← Cancelar y volver al login</a>
            </p>
        </form>
    </section>
</body>
</html>
