<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Recuperar Clave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #000; color: #fff; padding-top: 100px;">
    <div class="container" style="max-width: 400px; background: #111; padding: 30px; border: 1px solid #333;">
        <h2 style="font-family: sans-serif;">RECUPERAR CLAVE</h2>
        <p style="font-size: 12px; color: #666;">Ingresa tu correo para recibir un enlace.</p>

        <div th:if="${status}" class="alert alert-success" th:text="${status}" style="font-size:12px;"></div>

        <form th:action="@{/forgot-password}" method="POST">
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="tucorreo@ejemplo.com" required style="background: #000; color: #fff; border: 1px solid #444;">
            </div>
            <button type="submit" class="btn btn-light w-100" style="font-weight: bold;">ENVIAR ENLACE</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/login}" style="color: #666; font-size: 12px;">Volver al Login</a>
        </div>
    </div>
</body>
</html>
