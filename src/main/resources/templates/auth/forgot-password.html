<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/guest-layout :: layout(content=~{::section})}">
<body>
    <section>
        <h2>RECUPERAR CLAVE</h2>
        <p class="subtitle">Te enviaremos un link de recuperación</p>

        <div th:if="${status}" class="alert alert-success" th:text="${status}" style="background:#002b0c; border:1px solid #00c030; color:#8affaa;"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="background:#2b0000; border:1px solid #c00; color:#ff8a8a;"></div>

        <form th:action="@{/forgot-password}" method="POST">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" class="form-control" type="email" placeholder="tucorreo@ejemplo.com" required autofocus>

            <button type="submit" class="btn-stateless">ENVIAR ENLACE</button>

            <p class="text-center mt-4" style="font-size:11px; color:rgba(255,255,255,0.5);">
                <a th:href="@{/login}">← Volver a iniciar sesión</a>
            </p>
        </form>
    </section>
</body>
</html>
