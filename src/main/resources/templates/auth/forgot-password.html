<div th:replace="~{layouts/guest-layout :: guest-layout(content=~{::section})}">
    <section class="auth-card">
        <h2>RECUPERAR CONTRASEÑA</h2>
        <p class="subtitle">Te enviaremos un link de recuperación</p>

        <div th:if="${status}" class="alert alert-success" th:text="${status}" style="font-size:12px;"></div>

        <form th:action="@{/forgot-password}" method="POST">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" class="form-control" type="email" placeholder="tucorreo@ejemplo.com" required autofocus>
            <button type="submit" class="btn-stateless">ENVIAR LINK</button>
            <p class="text-center mt-4" style="font-size:11px;">
                <a th:href="@{/login}" style="color:rgba(255,255,255,0.5); text-decoration:none;">← Volver a iniciar sesión</a>
            </p>
        </form>
    </section>
</div>
