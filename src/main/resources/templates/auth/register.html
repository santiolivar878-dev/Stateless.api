<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/guest-layout :: layout(content=~{::section})}">
<body>
    <section>
        <h2>CREAR CUENTA</h2>
        <p class="subtitle">Únete a Stateless</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="background:#2b0000; border:1px solid #c00; color:#ff8a8a;"></div>

        <form th:action="@{/register}" method="POST">
            <label for="name">Nombre Completo</label>
            <input id="name" name="name" class="form-control" type="text" placeholder="Tu nombre completo" required autofocus>

            <label for="email">Correo electrónico</label>
            <input id="email" name="email" class="form-control" type="email" placeholder="tucorreo@ejemplo.com" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" class="form-control" type="password" placeholder="••••••••" required>

            <button type="submit" class="btn-stateless">REGISTRARME</button>

            <p class="text-center mt-4" style="font-size:11px; color:rgba(255,255,255,0.5);">
                ¿Ya tienes cuenta? <a th:href="@{/login}" style="color:#fff; font-weight:bold;">Inicia sesión</a>
            </p>
        </form>
    </section>
</body>
</html>
