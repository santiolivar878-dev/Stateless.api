<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/guest-layout :: layout(content=~{::section})}">
<body>
    <section class="auth-card">
        <h2 style="font-family:'Bebas Neue';">CREAR CUENTA</h2>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/register}" method="POST">
            <label>Nombre Completo</label>
            <input type="text" name="name" class="form-control" required>
            
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
            
            <label>Contraseña</label>
            <input type="password" name="password" class="form-control" required>
            
            <button type="submit" class="btn-stateless">REGISTRARME</button>
            <p class="mt-3 text-center" style="font-size:12px;">
                ¿Ya tienes cuenta? <a th:href="@{/login}" style="color:#fff;">Inicia sesión</a>
            </p>
        </form>
    </section>
</body>
</html>
