<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section style="padding: 60px; max-width: 1000px; margin: 0 auto; color: #fff; background: #000;">
    <h1 style="font-family:'Bebas Neue', sans-serif; font-size:48px; letter-spacing:4px;">MI CARRITO</h1>
    <p style="opacity: 0.5; margin-bottom: 40px;" th:text="${carrito.items.size() + ' PRODUCTOS'}"></p>

    <div th:if="${not #lists.isEmpty(carrito.items)}">
        <div style="border-top: 1px solid #333;">
            <div th:each="item : ${carrito.items}" style="display:flex; align-items:center; gap:24px; padding:20px 0; border-bottom:1px solid #222;">
                
                <!-- Imagen -->
                <img th:src="${item.producto.imagen != null ? (item.producto.imagen.startsWith('http') ? item.producto.imagen : '/images/' + item.producto.imagen) : '/images/placeholder.jpg'}" 
                     style="width:70px; height:90px; object-fit:cover; border: 1px solid #333;">

                <!-- Info (Texto Blanco) -->
                <div style="flex:1;">
                    <p style="font-family:'Bebas Neue'; font-size:22px; margin:0; color:#fff;" th:text="${item.producto.nombre}"></p>
                    <p th:if="${item.variante != null}" style="font-size:11px; color:#aaa; margin:5px 0;">
                        COLOR: <span th:text="${item.variante.color}"></span>
                    </p>
                    <p th:text="${'$' + item.precioUnitario}" style="font-weight:bold; color:#fff;"></p>
                </div>

                <!-- Cantidad -->
                <div style="color:#000;">
                    <input type="number" th:value="${item.cantidad}" readonly 
                           style="width:50px; text-align:center; border:none; padding:5px; font-weight:bold;">
                </div>

                <!-- Subtotal -->
                <div style="text-align:right; min-width:100px;">
                    <p style="font-family:'Bebas Neue'; font-size:20px; color:#fff;" 
                       th:text="${'$' + #numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></p>
                </div>
            </div>
        </div>

        <div style="text-align:right; margin-top:40px;">
            <p style="font-size:12px; opacity:0.5;">TOTAL ESTIMADO</p>
            <h2 style="font-family:'Bebas Neue'; font-size:40px;" th:text="${'$' + #numbers.formatDecimal(carrito.total, 0, 'COMMA', 0, 'POINT')}"></h2>
            <br>
            <a th:href="@{/checkout}" style="background:#fff; color:#000; padding:15px 50px; text-decoration:none; font-weight:bold; letter-spacing:2px;">PAGAR AHORA</a>
        </div>
    </div>

    <div th:unless="${not #lists.isEmpty(carrito.items)}" style="text-align:center; padding:100px 0;">
        <h2 style="opacity:0.2; font-family:'Bebas Neue';">TU CARRITO ESTÁ VACÍO</h2>
        <a th:href="@{/}" style="color:#fff; text-decoration:underline; font-size:12px;">VOLVER A LA TIENDA</a>
    </div>
</section>
</body>
</html>
