<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section style="background:#fff; color:#000; min-height:85vh; padding:60px 40px;">

    <div style="max-width:1100px; margin:0 auto;">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000; padding-bottom:16px; margin-bottom:40px;">
            <div>
                <p style="font-size:11px; letter-spacing:4px; text-transform:uppercase; opacity:0.5; margin:0;">Bolsa de Compras</p>
                <h1 style="font-family:'Bebas Neue', sans-serif; font-size:48px; letter-spacing:4px; margin:0;">TU CARRITO</h1>
            </div>
            <a th:href="@{/}" style="color:#000; font-size:11px; letter-spacing:2px; text-transform:uppercase; text-decoration:underline;">
                ← Continuar Comprando
            </a>
        </div>

        <!-- Si el carrito está vacío -->
        <div th:if="${carrito == null || #lists.isEmpty(carrito.items)}" style="text-align:center; padding:80px 20px;">
            <p style="font-family:'Bebas Neue'; font-size:32px; letter-spacing:2px; opacity:0.4; margin-bottom:20px;">TU BOLSA ESTÁ VACÍA</p>
            <a th:href="@{/}" style="display:inline-block; padding:14px 36px; background:#000; color:#fff; text-decoration:none; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase;">
                Ver Colecciones
            </a>
        </div>

        <!-- Carrito con productos -->
        <div th:unless="${carrito == null || #lists.isEmpty(carrito.items)}" style="display:grid; grid-template-columns:2fr 1fr; gap:40px;">
            
            <!-- Lista de Ítems -->
            <div>
                <div th:each="item : ${carrito.items}" style="display:flex; gap:20px; padding:20px 0; border-bottom:1px solid #eee; align-items:center;">
                    <img th:src="${item.producto.imagen != null ? (item.producto.imagen.startsWith('http') ? item.producto.imagen : '/images/' + item.producto.imagen) : '/images/placeholder.jpg'}" 
                         style="width:90px; aspect-ratio:3/4; object-fit:cover; border:1px solid #eee;">
                    
                    <div style="flex:1;">
                        <h3 th:text="${item.producto.nombre}" style="font-family:'Bebas Neue'; font-size:22px; letter-spacing:2px; margin:0 0 4px;"></h3>
                        <p th:if="${item.variante != null}" th:text="'Color: ' + ${item.variante.color}" style="font-size:11px; letter-spacing:1px; text-transform:uppercase; opacity:0.5; margin-bottom:6px;"></p>
                        <p th:text="${'$' + #numbers.formatDecimal(item.precioUnitario, 0, 'COMMA', 0, 'POINT') + ' COP'}" style="font-size:13px; font-weight:600; margin:0;"></p>
                    </div>

                    <!-- Cantidad -->
                    <div style="display:flex; align-items:center; border:1px solid #000; padding:4px 10px;">
                        <span th:text="'Cant: ' + ${item.cantidad}" style="font-size:12px; font-weight:700;">1</span>
                    </div>

                    <!-- Subtotal Ítem -->
                    <div style="min-width:110px; text-align:right;">
                        <p th:text="${'$' + #numbers.formatDecimal(item.precioUnitario * item.cantidad, 0, 'COMMA', 0, 'POINT')}" style="font-size:14px; font-weight:700; margin:0;"></p>
                    </div>
                </div>
            </div>

            <!-- Resumen y Checkout -->
            <div style="background:#fafafa; border:1px solid #eee; padding:32px; height:fit-content;">
                <h3 style="font-family:'Bebas Neue'; font-size:24px; letter-spacing:2px; margin-bottom:20px; border-bottom:1px solid #000; padding-bottom:10px;">
                    RESUMEN
                </h3>

                <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:13px;">
                    <span style="opacity:0.6;">Subtotal</span>
                    <span th:text="${'$' + #numbers.formatDecimal(carrito.total, 0, 'COMMA', 0, 'POINT') + ' COP'}"></span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-size:13px;">
                    <span style="opacity:0.6;">Envío</span>
                    <span style="font-weight:600; color:green;">GRATIS</span>
                </div>

                <hr style="border-color:#ddd; margin-bottom:20px;">

                <div style="display:flex; justify-content:space-between; margin-bottom:28px;">
                    <span style="font-weight:700; font-size:14px; letter-spacing:1px;">TOTAL</span>
                    <span th:text="${'$' + #numbers.formatDecimal(carrito.total, 0, 'COMMA', 0, 'POINT') + ' COP'}" style="font-family:'Bebas Neue'; font-size:26px;"></span>
                </div>

                <a th:href="@{/checkout}" style="display:block; width:100%; background:#000; color:#fff; text-align:center; padding:16px; font-size:12px; font-weight:700; letter-spacing:3px; text-transform:uppercase; text-decoration:none; transition:0.2s;"
                   onmouseover="this.style.background='#333'" onmouseout="this.style.background='#000'">
                    PROCEDER AL PAGO →
                </a>
            </div>

        </div>
    </div>

</section>
</body>
</html>
