<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section style="background:#fff; color:#000;">

<style>
@keyframes lineSpeed {
    0%   { transform: translateX(-150px); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateX(100vw); opacity: 0; }
}
@keyframes rpmPulse {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 1; }
}
.speed-line {
    position: absolute;
    height: 1px;
    width: 150px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    animation: lineSpeed linear infinite;
}
.rpm-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 30px;
    justify-content: center;
    align-items: flex-end;
    height: 60px;
}
.rpm-bar span {
    display: block;
    width: 6px;
    background: #fff;
    animation: rpmPulse 1.2s ease-in-out infinite;
}
.producto-card-es {
    border: 1px solid #000;
    padding: 16px;
    background: #fff;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.producto-card-es:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.15);
}
</style>

<!-- HERO CON LÍNEAS DE VELOCIDAD -->
<div style="position:relative; background:#000; color:#fff; min-height:85vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:80px 40px; overflow:hidden;">
    <div class="speed-line" style="top:20%; animation-duration:2.1s;"></div>
    <div class="speed-line" style="top:35%; animation-duration:1.7s; animation-delay:0.4s;"></div>
    <div class="speed-line" style="top:50%; animation-duration:2.4s; animation-delay:0.8s;"></div>
    <div class="speed-line" style="top:65%; animation-duration:1.9s; animation-delay:0.2s;"></div>
    <div class="speed-line" style="top:80%; animation-duration:2.2s; animation-delay:1.1s;"></div>

    <div style="position:relative; z-index:2; max-width:800px;">
        <div class="rpm-bar">
            <span style="height:12px; animation-delay:0s;"></span>
            <span style="height:24px; animation-delay:0.1s;"></span>
            <span style="height:40px; animation-delay:0.2s;"></span>
            <span style="height:56px; animation-delay:0.3s;"></span>
            <span style="height:72px; animation-delay:0.4s;"></span>
            <span style="height:56px; animation-delay:0.5s;"></span>
            <span style="height:40px; animation-delay:0.6s;"></span>
            <span style="height:24px; animation-delay:0.7s;"></span>
            <span style="height:12px; animation-delay:0.8s;"></span>
        </div>

        <div style="display:inline-block; border:1px solid rgba(255,255,255,0.3); padding:6px 16px; font-size:11px; letter-spacing:5px; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:20px;">
            Colección 2026 — Essentials
        </div>

        <h1 style="font-family:'Bebas Neue'; font-size:clamp(64px, 12vw, 130px); letter-spacing:10px; line-height:0.9; margin:0 0 10px;">ESSENTIALS</h1>
        <p style="font-family:'Bebas Neue'; font-size:clamp(20px, 4vw, 36px); letter-spacing:6px; opacity:0.3; margin-bottom:10px;">DRIFT · STREET · STYLE</p>
        <p style="font-size:11px; letter-spacing:5px; text-transform:uppercase; opacity:0.5; margin-bottom:35px;">Ropa limpia, precisa y sin complicaciones.</p>
        <a href="#catalogo" style="display:inline-block; padding:14px 40px; background:#fff; color:#000; text-decoration:none; font-size:11px; font-weight:700; letter-spacing:4px; text-transform:uppercase;">Ver colección</a>
    </div>
</div>

<!-- CATÁLOGO -->
<div id="catalogo" style="padding:80px 40px; background:#fff;">
    <div style="margin-bottom:40px; border-bottom:1px solid #000; padding-bottom:20px; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
            <p style="font-size:11px; letter-spacing:4px; text-transform:uppercase; opacity:0.5; margin:0;">Catálogo</p>
            <h2 style="font-family:'Bebas Neue'; font-size:48px; letter-spacing:4px; margin:0;">ROPA ESSENTIALS</h2>
        </div>
        <span style="font-size:11px; letter-spacing:3px; text-transform:uppercase; opacity:0.5;">Stock disponible</span>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:24px;">
        <div th:each="p : ${productos}" class="producto-card-es">
            <a th:href="@{'/producto/' + ${p.id}}" style="text-decoration:none; color:#000;">
                <img th:src="${p.imagen != null ? (p.imagen.startsWith('http') ? p.imagen : '/images/' + p.imagen) : '/images/placeholder.jpg'}" 
                     style="width:100%; aspect-ratio:3/4; object-fit:cover; margin-bottom:14px; display:block;">
                <p th:text="${p.nombre}" style="font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px;"></p>
                <p th:if="${p.precio != null}" th:text="${'$' + #numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT') + ' COP'}" style="font-family:'Bebas Neue'; font-size:20px; color:#666; margin-bottom:14px;"></p>
            </a>

            <form th:action="@{'/carrito/agregar/' + ${p.id}}" method="POST">
                <button type="submit" style="width:100%; background:#fff; color:#000; border:1px solid #000; padding:12px; font-weight:700; font-size:11px; letter-spacing:2px; text-transform:uppercase; cursor:pointer;" onmouseover="this.style.background='#000';this.style.color='#fff';" onmouseout="this.style.background='#fff';this.style.color='#000';">
                    Añadir al carrito
                </button>
            </form>
        </div>
    </div>
</div>

</section>
</body>
</html>
