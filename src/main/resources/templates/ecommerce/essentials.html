<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section>
    <div style="background:#f4f4f4; padding:100px 40px; text-align:center;">
        <h1 style="font-family:'Bebas Neue'; font-size:80px; letter-spacing:10px;">ESSENTIALS</h1>
        <p style="letter-spacing:4px; opacity:0.6;">BÁSICOS DE ALTO NIVEL</p>
    </div>
    <div style="padding:60px 40px; display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:30px;">
        <div th:each="p : ${essentials}" style="border:1px solid #eee; padding:20px;">
            <a th:href="@{'/producto/' + ${p.id}}" style="text-decoration:none; color:inherit;">
                <img th:src="${p.imagen}" style="width:100%; aspect-ratio:3/4; object-fit:cover;">
                <p th:text="${p.nombre}" style="font-family:'Bebas Neue'; font-size:22px; margin-top:15px;"></p>
                <p th:text="${'$' + p.precio}" style="font-weight:700;"></p>
            </a>
        </div>
    </div>
</section>
</body>
</html>
