<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/app-layout :: layout(content=~{::section})}">
<body>
<section>
    <!-- Encabezado de la Colección -->
    <div style="background:#000; padding:100px 40px; text-align:center; border-bottom:1px solid #222;">
        <h1 style="font-family:'Bebas Neue'; font-size:80px; letter-spacing:10px; color:#fff;" th:text="${titulo}">COLECCIÓN</h1>
        <p style="letter-spacing:4px; opacity:0.5; color:#fff;">STATELESS // 2026 DROP</p>
    </div>

    <!-- Grid de Productos -->
    <div style="padding:60px 40px; background:#fff;">
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:30px;">
            
            <div th:each="p : ${productos}" style="border:1px solid #eee; padding:20px; transition:0.3s;" onmouseover="this.style.borderColor='#000'">
                <a th:href="@{'/producto/' + ${p.id}}" style="text-decoration:none; color:#000;">
                    <!-- Imagen con respaldo -->
                    <img th:src="${p.imagen != null ? (p.imagen.startsWith('http') ? p.imagen : '/images/' + p.imagen) : '/images/placeholder.jpg'}" 
                         style="width:100%; aspect-ratio:3/4; object-fit:cover; margin-bottom:15px;">
                    
                    <p th:text="${p.nombre}" style="font-family:'Bebas Neue'; font-size:24px; margin:0;"></p>
                    <p th:if="${p.precio != null}" th:text="${'$' + #numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}" style="font-weight:700; margin-top:5px;"></p>
                </a>
                
                <form th:action="@{'/carrito/agregar/' + ${p.id}}" method="POST" style="margin-top:15px;">
                    <button type="submit" class="btn-stateless" style="width:100%; background:#000; color:#fff; border:none; padding:12px; font-weight:bold; cursor:pointer;">
                        AÑADIR AL CARRITO
                    </button>
                </form>
            </div>
            
        </div>

        <!-- Si la categoría está vacía en la DB -->
        <div th:if="${#lists.isEmpty(productos)}" style="text-align:center; padding:100px 0; color:#000;">
            <p style="opacity:0.3; font-family:'Bebas Neue'; font-size:24px;">PRÓXIMAMENTE DISPONIBLE</p>
            <a th:href="@{/}" style="color:#000; text-decoration:underline; font-size:12px;">VOLVER AL INICIO</a>
        </div>
    </div>
</section>
</body>
</html>
