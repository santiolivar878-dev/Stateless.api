<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:3px;">Editar Usuario</h2>
        <a th:href="@{/admin/usuarios}" class="btn-sl-outline">← Volver</a>
    </div>

    <div style="background:#fff; border:1px solid #eee; padding:32px; max-width:600px;">
        <form th:action="@{'/admin/usuarios/update/' + ${user.id}}" method="POST">
            <div class="sl-form-group">
                <label class="sl-label">Nombre Completo</label>
                <input type="text" name="name" th:value="${user.name}" class="sl-input" required>
            </div>

            <div class="sl-form-group">
                <label class="sl-label">Email</label>
                <input type="email" name="email" th:value="${user.email}" class="sl-input" required>
            </div>

            <div class="sl-form-group">
                <label class="sl-label">Rol del Sistema</label>
                <select name="role.id" class="sl-input">
                    <option th:each="r : ${roles}" th:value="${r.id}" th:text="${#strings.toUpperCase(r.name)}" th:selected="${r.id == user.role.id}"></option>
                </select>
            </div>

            <div class="sl-form-group">
                <label class="sl-label">Nueva Contraseña <small style="opacity:0.5; font-size:10px;">(Dejar vacío para mantener la actual)</small></label>
                <input type="password" name="newPassword" class="sl-input" placeholder="••••••••">
            </div>

            <div style="display:flex; gap:12px; margin-top:8px;">
                <button type="submit" class="btn-sl">Guardar Cambios</button>
                <a th:href="@{/admin/usuarios}" class="btn-sl-outline">Cancelar</a>
            </div>
        </form>
    </div>

</section>
</body>
</html>
