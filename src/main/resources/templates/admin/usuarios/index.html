<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <div th:if="${success}" class="alert-success-sl" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="border-radius:0;"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:3px;">Gestión de Usuarios</h2>
    </div>

    <table class="stateless-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td style="font-weight:600;" th:text="${u.name}"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <span th:text="${#strings.toUpperCase(u.role != null ? u.role.name : 'cliente')}" 
                          style="background:#000; color:#fff; font-size:10px; padding:3px 8px; font-weight:700; letter-spacing:1px;"></span>
                </td>
                <td>
                    <span th:if="${u.estado == 'activo'}" style="background:green; color:#fff; padding:2px 8px; font-size:10px; font-weight:700;">ACTIVO</span>
                    <span th:unless="${u.estado == 'activo'}" style="background:#c00; color:#fff; padding:2px 8px; font-size:10px; font-weight:700;">INACTIVO</span>
                </td>
                <td style="display:flex; gap:8px;">
                    <a th:href="@{'/admin/usuarios/edit/' + ${u.id}}" class="btn-sl-outline" style="padding:4px 12px; font-size:10px;">Editar</a>
                    
                    <form th:action="@{'/admin/usuarios/toggle/' + ${u.id}}" method="POST">
                        <button type="submit" 
                                th:class="${u.estado == 'activo' ? 'btn-sl-danger' : 'btn-sl'}"
                                th:text="${u.estado == 'activo' ? 'Inhabilitar' : 'Habilitar'}"
                                style="padding:4px 12px; font-size:10px;"></button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</section>
</body>
</html>
