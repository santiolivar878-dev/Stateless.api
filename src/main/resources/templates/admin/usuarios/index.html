<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 style="font-family:'Bebas Neue'; font-size:28px; letter-spacing:2px;">GESTIÓN DE USUARIOS</h2>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}" style="border-radius:0;"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="border-radius:0;"></div>

    <table class="table align-middle bg-white border">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.name}" style="font-weight:bold;"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <span th:text="${#strings.toUpperCase(u.role.name)}" class="badge bg-light text-dark border"></span>
                </td>
                <td>
                    <span th:if="${u.estado == 'activo'}" class="text-success" style="font-size:11px; font-weight:bold;">● ACTIVO</span>
                    <span th:unless="${u.estado == 'activo'}" class="text-danger" style="font-size:11px; font-weight:bold;">● INACTIVO</span>
                </td>
                <td style="display:flex; gap:10px;">
                    <a th:href="@{'/admin/usuarios/edit/' + ${u.id}}" class="btn btn-sm btn-outline-dark">EDITAR</a>
                    
                    <!-- Botón Habilitar/Inhabilitar -->
                    <form th:action="@{'/admin/usuarios/toggle/' + ${u.id}}" method="POST">
                        <button type="submit" 
                                th:class="${u.estado == 'activo' ? 'btn btn-sm btn-danger' : 'btn btn-sm btn-success'}"
                                th:text="${u.estado == 'activo' ? 'INHABILITAR' : 'HABILITAR'}"
                                style="font-size:10px;"></button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</section>
</body>
</html>
