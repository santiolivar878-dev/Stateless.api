<!-- SECCIÓN DE VARIANTES (Replicando tu Blade) -->
<div style="background:#fff; border:1px solid #eee; padding:32px; max-width:600px; margin-top:24px;">
    <h3 style="font-family:'Bebas Neue'; font-size:24px; letter-spacing:3px; margin-bottom:24px;">VARIANTES DE COLOR</h3>

    <div th:each="v : ${producto.variantes}" style="display:flex; align-items:center; gap:12px; padding:12px; border:1px solid #eee; margin-bottom:12px;">
        <div th:style="'width:32px; height:32px; border-radius:50%; border:1px solid #ddd; background:' + ${v.hex}"></div>
        <div style="flex:1;">
            <p th:text="${v.color}" style="font-size:13px; font-weight:600; margin:0;"></p>
            <p th:text="'Stock: ' + ${v.stockActual}" style="font-size:12px; opacity:0.5; margin:0;"></p>
        </div>
        <form th:action="@{'/admin/variantes/delete/' + ${v.id}}" method="POST">
            <button type="submit" class="btn-sl-danger" style="font-size:11px; padding:6px 12px;">Eliminar</button>
        </form>
    </div>

    <!-- Formulario para nueva variante -->
    <div style="border-top:1px solid #eee; padding-top:24px; margin-top:8px;">
        <h4 style="font-size:13px; text-transform:uppercase; margin-bottom:16px;">Agregar variante</h4>
        <form th:action="@{'/admin/variantes/store/' + ${producto.id}}" method="POST" enctype="multipart/form-data">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
                <input type="text" name="color" class="sl-input" placeholder="Nombre (ej: Negro)" required>
                <input type="color" name="hex" value="#000000" style="width:100%; height:40px; cursor:pointer;">
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
                <input type="number" name="stockActual" class="sl-input" placeholder="Stock" required>
                <input type="file" name="imagen_file" class="sl-input">
            </div>
            <button type="submit" class="btn-sl">+ Agregar variante</button>
        </form>
    </div>
</div>
