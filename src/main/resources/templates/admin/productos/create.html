<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:3px;">Registrar Producto</h2>
        <a th:href="@{/admin/productos}" class="btn-sl-outline">← Volver</a>
    </div>

    <div style="background:#fff; border:1px solid #eee; padding:32px; max-width:650px;">
        <form th:action="@{/admin/productos/store}" method="POST" enctype="multipart/form-data">
            
            <div class="sl-form-group">
                <label class="sl-label">Nombre del Producto</label>
                <input type="text" name="nombre" class="sl-input" required>
            </div>

            <div class="sl-form-group">
                <label class="sl-label">Descripción</label>
                <textarea name="descripcion" class="sl-input" rows="3" placeholder="Detalles de la prenda, corte y materiales..."></textarea>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div class="sl-form-group">
                    <label class="sl-label">Precio ($ COP)</label>
                    <input type="number" step="0.01" name="precio" class="sl-input" placeholder="Ej: 159000" required>
                </div>
                <div class="sl-form-group">
                    <label class="sl-label">Estado</label>
                    <select name="estado" class="sl-input">
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
                <div class="sl-form-group">
                    <label class="sl-label">Stock Actual</label>
                    <input type="number" name="stockActual" class="sl-input" value="10" min="0" required>
                </div>
                <div class="sl-form-group">
                    <label class="sl-label">Stock Mínimo</label>
                    <input type="number" name="stockMinimo" class="sl-input" value="5" min="0" required>
                </div>
                <div class="sl-form-group">
                    <label class="sl-label">Stock Máximo</label>
                    <input type="number" name="stockMaximo" class="sl-input" value="100" min="0" required>
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div class="sl-form-group">
                    <label class="sl-label">Categoría</label>
                    <select name="categoria.id" class="sl-input" required>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                </div>
                <div class="sl-form-group">
                    <label class="sl-label">Proveedor</label>
                    <select name="proveedor.id" class="sl-input" required>
                        <option th:each="prov : ${proveedores}" th:value="${prov.id}" th:text="${prov.nombre}"></option>
                    </select>
                </div>
            </div>

            <div class="sl-form-group">
                <label class="sl-label">Imagen Principal</label>
                <input type="file" name="imagen_file" class="sl-input" accept="image/*" required>
                <p style="font-size:11px; opacity:0.5; margin-top:4px;">Formatos soportados: JPG, PNG, WEBP</p>
            </div>

            <div style="display:flex; gap:12px; margin-top:12px;">
                <button type="submit" class="btn-sl">Guardar Producto</button>
                <a th:href="@{/admin/productos}" class="btn-sl-outline">Cancelar</a>
            </div>

        </form>
    </div>

</section>
</body>
</html>
