<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>
    <h2 style="font-family:'Bebas Neue'; margin-bottom:30px; letter-spacing:2px;">Registrar Producto</h2>
    
    <form th:action="@{/admin/productos/store}" method="POST" enctype="multipart/form-data" class="bg-white p-4 border">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" style="font-size:11px; text-transform:uppercase;">Nombre</label>
                <input type="text" name="nombre" class="form-control" style="border-radius:0;" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" style="font-size:11px; text-transform:uppercase;">Precio</label>
                <input type="number" step="0.01" name="precio" class="form-control" style="border-radius:0;" required>
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label" style="font-size:11px; text-transform:uppercase;">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3" style="border-radius:0;"></textarea>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" style="font-size:11px; text-transform:uppercase;">Stock Inicial</label>
                <input type="number" name="stockActual" class="form-control" style="border-radius:0;" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" style="font-size:11px; text-transform:uppercase;">Categoría</label>
                <select name="categoria" class="form-select" style="border-radius:0;">
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" style="font-size:11px; text-transform:uppercase;">Proveedor</label>
                <select name="proveedor" class="form-select" style="border-radius:0;">
                    <option th:each="prov : ${proveedores}" th:value="${prov.id}" th:text="${prov.nombre}"></option>
                </select>
            </div>
            <div class="col-md-12 mb-4">
                <label class="form-label" style="font-size:11px; text-transform:uppercase;">Imagen del Producto</label>
                <input type="file" name="imagen_file" class="form-control" style="border-radius:0;" required>
            </div>
        </div>
        <button type="submit" class="btn-sl" style="background:#000; color:#fff; padding:12px 40px; border:none; font-size:12px; letter-spacing:1px;">GUARDAR PRODUCTO</button>
        <a th:href="@{/admin/productos}" class="ms-3 text-dark text-decoration-none" style="font-size:12px;">Cancelar</a>
    </form>
</section>
</body>
</html>
