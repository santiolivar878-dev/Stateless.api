<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <div th:if="${success}" class="alert-success-sl" th:text="${success}"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:3px;">Logística y Envíos</h2>
    </div>

    <table class="stateless-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Pedido</th>
                <th>Ciudad</th>
                <th>Dirección</th>
                <th>Transportadora</th>
                <th>N° Guía</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${envios}">
                <td th:text="${e.id}"></td>
                <td style="font-weight:700;" th:text="${'#' + (e.venta != null ? e.venta.id : '—')}"></td>
                <td th:text="${e.ciudad}"></td>
                <td th:text="${e.direccion}"></td>
                <td th:text="${e.transportadora != null ? e.transportadora : 'PENDIENTE'}"></td>
                <td style="font-family:monospace; font-weight:600;" th:text="${e.numeroGuia != null ? e.numeroGuia : '---'}"></td>
                <td>
                    <span th:if="${e.estado == 'entregado'}" style="background:green; color:#fff; padding:2px 8px; font-size:10px; font-weight:700;">ENTREGADO</span>
                    <span th:if="${e.estado == 'en_curso'}" style="background:#0066cc; color:#fff; padding:2px 8px; font-size:10px; font-weight:700;">EN CAMINO</span>
                    <span th:if="${e.estado == 'pendiente' || e.estado == 'preparando'}" style="background:#f59e0b; color:#000; padding:2px 8px; font-size:10px; font-weight:700;">PREPARANDO</span>
                </td>
                <td>
                    <a th:href="@{'/admin/envios/edit/' + ${e.id}}" class="btn-sl-outline" style="padding:4px 12px; font-size:10px;">Asignar Guía</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(envios)}">
                <td colspan="8" style="text-align:center; opacity:0.5; padding:40px;">No hay registros de envíos.</td>
            </tr>
        </tbody>
    </table>

</section>
</body>
</html>
