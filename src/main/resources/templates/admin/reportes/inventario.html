<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:3px;">Reporte de Inventario</h2>
        <a th:href="@{/admin/reportes}" class="btn-sl-outline">← Volver al Hub</a>
    </div>

    <!-- STATS -->
    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:20px; margin-bottom:32px;">
        <div class="stat-card">
            <div class="stat-label">Total Productos</div>
            <div class="stat-value" th:text="${totalProductos}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Stock Bajo</div>
            <div class="stat-value" style="color:#f59e0b;" th:text="${stockBajo}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Sin Stock</div>
            <div class="stat-value" style="color:#c00;" th:text="${sinStock}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Valor Inventario</div>
            <div class="stat-value" style="font-size:26px;" 
                 th:text="${'$' + #numbers.formatDecimal(valorInventario != null ? valorInventario : 0, 0, 'POINT', 0, 'COMMA')}">$0</div>
        </div>
    </div>

    <!-- TABLA DE ESTADO DE STOCK -->
    <div style="background:#fff; border:1px solid #eee; padding:24px;">
        <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:16px; font-weight:700;">Estado de Existencias</p>
        
        <table class="stateless-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock Actual</th>
                    <th>Mínimo</th>
                    <th>Valor Stock</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td style="font-weight:600;" th:text="${p.nombre}"></td>
                    <td th:text="${p.categoria != null ? p.categoria.nombre : '—'}"></td>
                    <td th:text="${'$' + #numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td th:text="${p.stockActual}" th:style="${p.stockActual <= p.stockMinimo ? 'color:#c00; font-weight:700;' : ''}"></td>
                    <td th:text="${p.stockMinimo}"></td>
                    <td style="font-weight:600;" th:text="${'$' + #numbers.formatDecimal(p.precio * p.stockActual, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td>
                        <span th:if="${p.stockActual == 0}" style="background:#c00; color:#fff; padding:2px 8px; font-size:10px; font-weight:700;">AGOTADO</span>
                        <span th:if="${p.stockActual > 0 && p.stockActual <= p.stockMinimo}" style="background:#f59e0b; color:#000; padding:2px 8px; font-size:10px; font-weight:700;">STOCK BAJO</span>
                        <span th:if="${p.stockActual > p.stockMinimo}" style="background:green; color:#fff; padding:2px 8px; font-size:10px; font-weight:700;">DISPONIBLE</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="7" style="text-align:center; opacity:0.4; padding:30px;">No hay productos registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
</body>
</html>
