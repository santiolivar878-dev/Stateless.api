<div th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<section>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue'; font-size:32px; letter-spacing:3px;">Reporte de Inventario</h2>
        <a th:href="@{/admin/reportes/ventas}" class="btn-sl-outline">Ver Ventas</a>
    </div>

    <!-- STATS CARDS -->
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:32px;">
        <div class="stat-card">
            <div class="stat-label">Total Productos</div>
            <div class="stat-value" th:text="${totalProductos}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Stock Bajo</div>
            <div class="stat-value" style="color:#f90;" th:text="${stockBajo}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Sin Stock</div>
            <div class="stat-value" style="color:#c00;" th:text="${sinStock}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Valor Inventario</div>
            <div class="stat-value" style="font-size:24px;" th:text="${'$' + #numbers.formatDecimal(valorInventario, 0, 'POINT', 0, 'COMMA')}"></div>
        </div>
    </div>

    <div style="background:#fff; border:1px solid #eee; padding:24px;">
        <table class="stateless-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Stock Actual</th>
                    <th>Min</th>
                    <th>Valor Stock</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.categoria.nombre}"></td>
                    <td th:text="${p.stockActual}" th:style="${p.stockActual <= p.stockMinimo ? 'color:#c00; font-weight:700' : ''}"></td>
                    <td th:text="${p.stockMinimo}"></td>
                    <td th:text="${'$' + (p.precio * p.stockActual)}"></td>
                    <td>
                        <span th:if="${p.stockActual == 0}" style="background:#c00; color:#fff; padding:2px 8px; font-size:10px;">AGOTADO</span>
                        <span th:if="${p.stockActual > 0 && p.stockActual <= p.stockMinimo}" style="background:#f90; color:#000; padding:2px 8px; font-size:10px;">STOCK BAJO</span>
                        <span th:if="${p.stockActual > p.stockMinimo}" style="background:green; color:#fff; padding:2px 8px; font-size:10px;">OK</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</div>
