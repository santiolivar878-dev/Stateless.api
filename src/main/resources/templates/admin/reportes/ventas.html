<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>
    <h2 style="font-family:'Bebas Neue'; font-size:32px; margin-bottom:24px;">Reporte de Ventas</h2>

    <form method="GET" th:action="@{/admin/reportes/ventas}" style="display:flex; gap:10px; margin-bottom:30px; align-items:flex-end;">
        <div>
            <label class="sl-label">Desde</label>
            <input type="date" name="desde" th:value="${desde}" class="sl-input">
        </div>
        <div>
            <label class="sl-label">Hasta</label>
            <input type="date" name="hasta" th:value="${hasta}" class="sl-input">
        </div>
        <button type="submit" class="btn-sl">Filtrar</button>
    </form>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px;">
        <div class="stat-card">
            <p class="stat-label">Total Recaudado</p>
            <p class="stat-value" th:text="${'$' + totalVentas}"></p>
        </div>
        <div class="stat-card">
            <p class="stat-label">Cantidad de Pedidos</p>
            <p class="stat-value" th:text="${totalPedidos}"></p>
        </div>
    </div>

    <table class="stateless-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="v : ${ventas}">
                <td th:text="${v.id}"></td>
                <td th:text="${#temporals.format(v.createdAt, 'dd/MM/yyyy')}"></td>
                <td th:text="${'$' + v.total}"></td>
            </tr>
        </tbody>
    </table>
</section>
</body>
</html>
