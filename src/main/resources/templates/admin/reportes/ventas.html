<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 style="font-family:'Bebas Neue'; font-size:28px;">Análisis Detallado</h2>
        <form method="GET" th:action="@{/admin/reportes/metricas}" style="display:flex; gap:10px;">
            <input type="date" name="desde" th:value="${desde}" class="form-control form-control-sm">
            <input type="date" name="hasta" th:value="${hasta}" class="form-control form-control-sm">
            <button type="submit" class="btn btn-sm btn-dark">FILTRAR</button>
        </form>
    </div>

    <div class="row mb-5">
        <div class="col-md-6">
            <div class="bg-white p-4 border text-center">
                <p style="font-size:11px; opacity:0.5;">INGRESOS TOTALES (RANGO)</p>
                <h1 th:text="'$' + ${ingresosPeriodo}" style="font-family:'Bebas Neue'; color:green;"></h1>
            </div>
        </div>
        <div class="col-md-6">
            <div class="bg-white p-4 border text-center">
                <p style="font-size:11px; opacity:0.5;">PEDIDOS PROCESADOS</p>
                <h1 th:text="${cantidadVentas}" style="font-family:'Bebas Neue';"></h1>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Top Productos -->
        <div class="col-md-7">
            <h4 style="font-family:'Bebas Neue'; margin-bottom:15px;">MÁS VENDIDOS</h4>
            <table class="table bg-white border">
                <thead><tr><th>Producto</th><th>Uds. Vendidas</th></tr></thead>
                <tbody>
                    <tr th:each="item : ${topProductos}">
                        <td th:text="${item[0]}"></td>
                        <td th:text="${item[1]}" style="font-weight:bold;"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- Alertas Stock -->
        <div class="col-md-5">
            <h4 style="font-family:'Bebas Neue'; color:#c00; margin-bottom:15px;">⚠️ ALERTAS STOCK</h4>
            <div class="list-group">
                <div th:each="p : ${productosAlerta}" class="list-group-item d-flex justify-content-between">
                    <span th:text="${p.nombre}"></span>
                    <span class="badge bg-danger" th:text="${p.stockActual}">0</span>
                </div>
                <p th:if="${conteoAlerta == 0}" class="text-muted">No hay productos en stock bajo.</p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
