<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:3px;">Reporte de Ventas</h2>
        <a th:href="@{/admin/reportes}" class="btn-sl-outline">← Volver al Hub</a>
    </div>

    <!-- FILTRO DE FECHAS -->
    <form method="GET" th:action="@{/admin/reportes/ventas}" 
          style="background:#fff; border:1px solid #eee; padding:20px; margin-bottom:24px; display:flex; gap:16px; align-items:flex-end;">
        <div>
            <label class="sl-label">Desde</label>
            <input type="date" name="desde" class="sl-input" th:value="${desde}">
        </div>
        <div>
            <label class="sl-label">Hasta</label>
            <input type="date" name="hasta" class="sl-input" th:value="${hasta}">
        </div>
        <button type="submit" class="btn-sl">Filtrar Período</button>
    </form>

    <!-- METRICAS DEL PERÍODO -->
    <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; margin-bottom:32px;">
        <div class="stat-card">
            <div class="stat-label">Ingresos Totales (Período)</div>
            <div class="stat-value" style="color:green;" 
                 th:text="${'$' + #numbers.formatDecimal(totalVentas != null ? totalVentas : 0, 0, 'POINT', 0, 'COMMA')}">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Pedidos Procesados</div>
            <div class="stat-value" th:text="${totalPedidos != null ? totalPedidos : 0}">0</div>
        </div>
    </div>

    <!-- DETALLE DE VENTAS -->
    <div style="background:#fff; border:1px solid #eee; padding:24px;">
        <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:16px; font-weight:700;">Detalle de Órdenes</p>
        
        <table class="stateless-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Método</th>
                    <th>Total</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${ventas}">
                    <td style="font-weight:700;" th:text="'#' + ${v.id}"></td>
                    <td th:text="${#temporals.format(v.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${v.usuario != null ? v.usuario.name : 'Invitado'}"></td>
                    <td style="text-transform:uppercase;" th:text="${v.metodoPago}"></td>
                    <td style="font-weight:700;" th:text="${'$' + #numbers.formatDecimal(v.total, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td>
                        <span th:text="${#strings.toUpperCase(v.estado)}" 
                              style="background:#000; color:#fff; font-size:10px; padding:2px 8px; font-weight:700;"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ventas)}">
                    <td colspan="6" style="text-align:center; opacity:0.4; padding:30px;">No hay ventas registradas en este rango de fechas.</td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
</body>
</html>
