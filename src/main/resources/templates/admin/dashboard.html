<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>
    <h1 style="font-family: 'Bebas Neue'; font-size: 32px; margin-bottom: 30px;">Resumen del Sistema</h1>

    <div class="row g-4">
        <!-- Widget Ventas -->
        <div class="col-md-4">
            <div class="card card-stat p-4">
                <p style="font-size: 11px; opacity: 0.5; margin: 0;">PEDIDOS TOTALES</p>
                <h2 th:text="${totalVentas}">0</h2>
            </div>
        </div>
        <!-- Widget Productos -->
        <div class="col-md-4">
            <div class="card card-stat p-4">
                <p style="font-size: 11px; opacity: 0.5; margin: 0;">PRODUCTOS EN CATÁLOGO</p>
                <h2 th:text="${totalProductos}">0</h2>
            </div>
        </div>
        <!-- Widget Usuarios -->
        <div class="col-md-4">
            <div class="card card-stat p-4">
                <p style="font-size: 11px; opacity: 0.5; margin: 0;">CLIENTES REGISTRADOS</p>
                <h2 th:text="${totalUsuarios}">0</h2>
            </div>
        </div>
    </div>

    <div class="mt-5">
        <h3 style="font-family: 'Bebas Neue'; font-size: 24px; margin-bottom: 20px;">Últimos Pedidos</h3>
        <table class="table table-hover bg-white border">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="venta : ${ventasRecientes}">
                    <td th:text="${venta.id}"></td>
                    <td th:text="${venta.usuario.name}">Cliente</td>
                    <td th:text="${'$' + venta.total}">0.00</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${venta.estado}">Pendiente</span>
                    </td>
                    <td th:text="${#temporals.format(venta.createdAt, 'dd/MM/yyyy')}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
