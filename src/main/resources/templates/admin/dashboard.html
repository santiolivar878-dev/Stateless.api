<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <style>
        .accesos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: calc(100% - 38px);
        }
        .btn-acceso {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 14px 16px;
            border: 1px solid #000;
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-acceso:hover {
            background: #f4f4f4;
        }
        .btn-acceso-dark {
            background: #000;
            color: #fff;
            border: 1px solid #000;
        }
        .btn-acceso-dark:hover {
            background: #222;
            color: #fff;
        }
    </style>

    <!-- 1. STATS CARDS -->
    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:20px; margin-bottom:32px;">
        <div class="stat-card">
            <div class="stat-label">Ventas Totales</div>
            <div class="stat-value" th:text="${'$' + #numbers.formatDecimal(totalVentas, 0, 'POINT', 0, 'COMMA')}">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Pedidos</div>
            <div class="stat-value" th:text="${totalPedidos}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Clientes</div>
            <div class="stat-value" th:text="${totalClientes}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Productos</div>
            <div class="stat-value" th:text="${totalProductos}">0</div>
        </div>
    </div>

    <!-- 2. GRÁFICAS -->
    <div style="display:grid; grid-template-columns:2fr 1fr; gap:24px; margin-bottom:32px;">

        <!-- Ventas último mes -->
        <div style="background:#fff; border:1px solid #eee; padding:24px;">
            <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:16px; font-weight:700;">Ventas último mes</p>
            <div style="position:relative; height:220px; width:100%;">
                <canvas id="graficaVentas"></canvas>
            </div>
        </div>

        <!-- Métodos de pago -->
        <div style="background:#fff; border:1px solid #eee; padding:24px;">
            <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:16px; font-weight:700;">Métodos de pago</p>
            <div style="position:relative; height:220px; width:100%;">
                <canvas id="graficaMetodos"></canvas>
            </div>
        </div>

    </div>

    <!-- 3. TABLAS INFORMATIVAS Y ACCESOS RÁPIDOS -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">

        <!-- Ventas Recientes -->
        <div style="background:#fff; border:1px solid #eee; padding:24px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin:0; font-weight:700;">Ventas Recientes</p>
                <a th:href="@{/admin/ventas}" style="font-size:11px; text-transform:uppercase; color:#000; text-decoration:underline;">Ver todas</a>
            </div>
            
            <table style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr style="border-bottom:2px solid #000;">
                        <th style="text-align:left; padding:8px 0; font-size:10px; letter-spacing:1px; text-transform:uppercase;">Cliente</th>
                        <th style="text-align:left; padding:8px 0; font-size:10px; letter-spacing:1px; text-transform:uppercase;">Método</th>
                        <th style="text-align:right; padding:8px 0; font-size:10px; letter-spacing:1px; text-transform:uppercase;">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v, iter : ${ventasRecientes}" th:if="${iter.count <= 5}" style="border-bottom:1px solid #f0f0f0;">
                        <td style="padding:10px 0; font-size:12px;" th:text="${v.usuario != null ? v.usuario.name : 'Invitado'}"></td>
                        <td style="padding:10px 0; font-size:12px; text-transform:uppercase;" th:text="${v.metodoPago}"></td>
                        <td style="padding:10px 0; font-size:12px; text-align:right; font-weight:600;" th:text="${'$' + #numbers.formatDecimal(v.total, 0, 'COMMA', 0, 'POINT')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventasRecientes)}">
                        <td colspan="3" style="padding:20px 0; opacity:0.4; font-size:12px; text-align:center;">No hay ventas registradas aún.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Módulo de Accesos Rápidos -->
        <div style="background:#fff; border:1px solid #eee; padding:24px;">
            <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:16px; font-weight:700;">Accesos Rápidos</p>
            
            <div class="accesos-grid">
                <a th:href="@{/admin/productos/nuevo}" class="btn-acceso">+ NUEVO PRODUCTO</a>
                <a th:href="@{/admin/proveedores/nuevo}" class="btn-acceso">+ NUEVO PROVEEDOR</a>
                <a th:href="@{/admin/categorias/nueva}" class="btn-acceso">+ NUEVA CATEGORÍA</a>

                <!-- REPORTE FINANCIERO: Exclusivo ADMIN -->
                <a th:href="@{/admin/reportes/ventas}" 
                   sec:authorize="hasAnyRole('ADMIN') or hasAnyAuthority('ADMIN', 'ROLE_ADMIN')"
                   class="btn-acceso btn-acceso-dark">
                    📊 REPORTE FINANCIERO
                </a>

                <!-- GESTIÓN DE ENVÍOS: Sustituto para EMPLEADOS -->
                <a th:href="@{/admin/envios}" 
                   sec:authorize="!hasAnyRole('ADMIN') and !hasAnyAuthority('ADMIN', 'ROLE_ADMIN')"
                   class="btn-acceso btn-acceso-dark">
                    📦 GESTIONAR ENVÍOS
                </a>
            </div>
        </div>

    </div>

    <!-- CARGA DE CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // 1. Gráfica de Barras Limpia y Elegante
        const ctxVentas = document.getElementById('graficaVentas').getContext('2d');
        const labelsDias = /*[[${labelsDias}]]*/ [];
        const ventasData = /*[[${ventasPorDia}]]*/ [];

        new Chart(ctxVentas, {
            type: 'bar',
            data: {
                labels: labelsDias,
                datasets: [{
                    label: 'Ventas COP',
                    data: ventasData,
                    backgroundColor: '#000000',
                    borderColor: '#000000',
                    borderRadius: 2,
                    barThickness: 14,
                    maxBarThickness: 20
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#000',
                        titleColor: '#fff',
                        bodyColor: '#00ff88',
                        borderColor: '#222',
                        borderWidth: 1,
                        padding: 10,
                        callbacks: {
                            label: function(context) {
                                return ' $ ' + Number(context.parsed.y).toLocaleString('es-CO') + ' COP';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#f5f5f5' },
                        ticks: {
                            color: '#888',
                            font: { size: 10 },
                            callback: function(val) {
                                if (val >= 1000000) return (val / 1000000) + 'M';
                                if (val >= 1000) return (val / 1000) + 'K';
                                return val;
                            }
                        }
                    },
                    x: {
                        grid: { display: false },
                        ticks: {
                            maxTicksLimit: 7,
                            maxRotation: 0,
                            autoSkip: true,
                            color: '#666',
                            font: { size: 10 }
                        }
                    }
                }
            }
        });

        // 2. Gráfica de Dona Monocromática STATELESS
        const ctxMetodos = document.getElementById('graficaMetodos').getContext('2d');
        const metodosRaw = /*[[${ventasPorMetodo}]]*/ [];

        // Normalizar etiquetas duplicadas (TARJETA_CREDITO -> TARJETA)
        const metodosMap = {};
        metodosRaw.forEach(item => {
            if (!item || !item[0]) return;
            let label = item[0].toUpperCase().replace('_CREDITO', '').replace('_DEBITO', '');
            let count = Number(item[1]) || 0;
            metodosMap[label] = (metodosMap[label] || 0) + count;
        });

        const labelsNorm = Object.keys(metodosMap);
        const dataNorm = Object.values(metodosMap);

        new Chart(ctxMetodos, {
            type: 'doughnut',
            data: {
                labels: labelsNorm.length > 0 ? labelsNorm : ['SIN DATOS'],
                datasets: [{
                    data: dataNorm.length > 0 ? dataNorm : [1],
                    backgroundColor: [
                        '#000000', // Negro Stateless
                        '#404040', // Gris Grafito
                        '#737373', // Gris Neutro
                        '#a3a3a3', // Gris Claro
                        '#d4d4d4'  // Plata
                    ],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            boxWidth: 10,
                            boxHeight: 10,
                            padding: 12,
                            font: { size: 10, weight: '600' },
                            color: '#333'
                        }
                    }
                }
            }
        });
        /*]]>*/
    </script>

</section>
</body>
</html>
