<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <div th:if="${success}" class="alert-success-sl" th:text="${success}"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:3px;">Lista de Ventas</h2>
    </div>

    <!-- STATS -->
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin-bottom:32px;">
        <div class="stat-card">
            <div class="stat-label">Total Recaudado</div>
            <div class="stat-value" th:text="${'$' + #numbers.formatDecimal(#aggregates.sum(ventas.![total]), 0, 'POINT', 0, 'COMMA')}">$0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Pedidos</div>
            <div class="stat-value" th:text="${ventas.size()}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Tipo Principal</div>
            <div class="stat-value" style="font-size:26px;">ONLINE / E-COMMERCE</div>
        </div>
    </div>

    <table class="stateless-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Método</th>
                <th>Total</th>
                <th>Estado Actual</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="v : ${ventas}">
                <td style="font-weight:700;" th:text="'#' + ${v.id}"></td>
                <td th:text="${#temporals.format(v.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${v.usuario != null ? v.usuario.name : 'Invitado'}"></td>
                <td style="text-transform:uppercase; font-size:11px; font-weight:600;" th:text="${v.metodoPago}"></td>
                <td style="font-weight:700;" th:text="${'$' + #numbers.formatDecimal(v.total, 0, 'COMMA', 0, 'POINT')}"></td>
                <td>
                    <form th:action="@{'/admin/ventas/update-status/' + ${v.id}}" method="POST">
                        <select name="nuevoEstado" class="sl-input" style="font-size:11px; padding:6px 10px; width:auto;" onchange="this.form.submit()">
                            <option value="pendiente" th:selected="${v.estado == 'pendiente'}">Pendiente</option>
                            <option value="pagado" th:selected="${v.estado == 'pagado' || v.estado == 'pago_confirmado'}">Pago Confirmado</option>
                            <option value="en_preparacion" th:selected="${v.estado == 'en_preparacion'}">En Preparación</option>
                            <option value="enviado" th:selected="${v.estado == 'enviado'}">Enviado</option>
                            <option value="entregado" th:selected="${v.estado == 'entregado'}">Entregado</option>
                            <option value="cancelado" th:selected="${v.estado == 'cancelado'}">Cancelado</option>
                        </select>
                    </form>
                </td>
                <td>
                    <a th:href="@{'/admin/ventas/' + ${v.id}}" class="btn-sl-outline" style="padding:4px 12px; font-size:10px;">Ver Detalle</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(ventas)}">
                <td colspan="7" style="text-align:center; opacity:0.5; padding:40px;">No hay ventas registradas.</td>
            </tr>
        </tbody>
    </table>

</section>
</body>
</html>
