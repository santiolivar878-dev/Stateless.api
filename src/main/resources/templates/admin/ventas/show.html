<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(content=~{::section})}">
<body>
<section>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2 style="font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:3px;" th:text="'Detalle del Pedido #' + ${venta.id}"></h2>
        <a th:href="@{/admin/ventas}" class="btn-sl-outline">← Volver al Listado</a>
    </div>

    <div style="display:grid; grid-template-columns:2fr 1fr; gap:24px;">

        <!-- ITEMS DEL PEDIDO -->
        <div style="background:#fff; border:1px solid #eee; padding:28px;">
            <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:20px; font-weight:700;">Productos en esta orden</p>
            
            <table class="stateless-table" style="border:none;">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Variante</th>
                        <th>Precio Unit.</th>
                        <th>Cant.</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${venta.items}">
                        <td style="font-weight:600;" th:text="${item.producto != null ? item.producto.nombre : 'Producto Eliminado'}"></td>
                        <td>
                            <span th:if="${item.variante != null}" th:text="${item.variante.color}" style="background:#000; color:#fff; font-size:10px; padding:2px 8px;"></span>
                            <span th:unless="${item.variante != null}" style="opacity:0.4;">Original</span>
                        </td>
                        <td th:text="${'$' + item.precioUnitario}"></td>
                        <td th:text="${item.cantidad}"></td>
                        <td style="font-weight:700;" th:text="${'$' + (item.precioUnitario * item.cantidad)}"></td>
                    </tr>
                </tbody>
            </table>

            <div style="text-align:right; margin-top:24px; padding-top:16px; border-top:2px solid #000;">
                <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:4px;">Total Pagado</p>
                <h3 style="font-family:'Bebas Neue'; font-size:36px;" th:text="${'$' + #numbers.formatDecimal(venta.total, 0, 'COMMA', 0, 'POINT') + ' COP'}"></h3>
            </div>
        </div>

        <!-- INFORMACIÓN LATERAL -->
        <div>
            <!-- Estado -->
            <div style="background:#fff; border:1px solid #eee; padding:24px; margin-bottom:20px;">
                <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:12px; font-weight:700;">Estado de la Orden</p>
                <form th:action="@{'/admin/ventas/update-status/' + ${venta.id}}" method="POST">
                    <select name="nuevoEstado" class="sl-input" style="margin-bottom:12px;">
                        <option value="pendiente" th:selected="${venta.estado == 'pendiente'}">Pendiente</option>
                        <option value="pagado" th:selected="${venta.estado == 'pagado' || venta.estado == 'pago_confirmado'}">Pago Confirmado</option>
                        <option value="en_preparacion" th:selected="${venta.estado == 'en_preparacion'}">En Preparación</option>
                        <option value="enviado" th:selected="${venta.estado == 'enviado'}">Enviado</option>
                        <option value="entregado" th:selected="${venta.estado == 'entregado'}">Entregado</option>
                        <option value="cancelado" th:selected="${venta.estado == 'cancelado'}">Cancelado</option>
                    </select>
                    <button type="submit" class="btn-sl" style="width:100%;">Actualizar Estado</button>
                </form>
            </div>

            <!-- Datos de Envío -->
            <div style="background:#fff; border:1px solid #eee; padding:24px;">
                <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:12px; font-weight:700;">Datos del Cliente</p>
                <p style="font-size:14px; font-weight:700; margin:0;" th:text="${venta.usuario != null ? venta.usuario.name : 'Invitado'}"></p>
                <p style="font-size:12px; opacity:0.6; margin-bottom:16px;" th:text="${venta.usuario != null ? venta.usuario.email : '—'}"></p>

                <hr style="border-color:#eee;">
                
                <p style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0.5; margin-bottom:4px; font-weight:700;">Destino de Envío</p>
                <p style="font-size:13px; margin:0;" th:text="${venta.envio != null ? venta.envio.direccion : 'Sin dirección'}"></p>
                <p style="font-size:13px; font-weight:700; margin:0;" th:text="${venta.envio != null ? venta.envio.ciudad : ''}"></p>
            </div>
        </div>

    </div>

</section>
</body>
</html>
